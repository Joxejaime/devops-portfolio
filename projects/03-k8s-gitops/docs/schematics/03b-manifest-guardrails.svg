<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1341" viewBox="0 0 1200 1341" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Two gates on every rendered manifest</title><desc id="d">Two gates on every rendered manifest. Schema validation plus tested policy checks, run on the final YAML. The checks run on the final YAML that Kustomize produces for each environment, not on the templates, so what is checked is exactly what would be applied. The policy checker is itself tested: 15 tests take good manifests, break one thing, and require the checker to reject them. That shows the policy can actually fail.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1339" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="234" height="30" rx="15" fill="#E6F0FF" stroke="#2563EB" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#0B2A5B">03 · KUBERNETES GITOPS</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Two gates on every rendered manifest</text><text x="40" y="151" font-size="21" fill="#475569">Schema validation plus tested policy checks, run on the final YAML.</text><g transform="translate(0,191.0)"><path d="M600.0,104.0 L600.0,123.2 Q600.0,135.2 588.0,135.2 L332.0,135.2 Q320.0,135.2 320.0,147.2 L320.0,166.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,104.0 L600.0,118.0 Q600.0,130.0 612.0,130.0 L868.0,130.0 Q880.0,130.0 880.0,142.0 L880.0,156.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M320.0,249.5 L320.0,268.8 Q320.0,280.8 332.0,280.8 L588.0,280.8 Q600.0,280.8 600.0,292.8 L600.0,312.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M880.0,260.0 L880.0,274.0 Q880.0,286.0 868.0,286.0 L612.0,286.0 Q600.0,286.0 600.0,298.0 L600.0,312.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,395.0 L600.0,440.5 Q600.0,452.5 588.0,452.5 L238.7,452.5 Q226.7,452.5 226.7,464.5 L226.7,510.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,395.0 L600.0,447.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M814.7,572.5 L758.7,572.5" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M226.7,635.0 L226.7,685.5 Q226.7,692.5 233.7,692.5 L233.7,692.5 Q240.7,692.5 240.7,699.5 L240.7,750.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,698.0 L600.0,717.0 Q600.0,724.0 593.0,724.0 L593.0,724.0 Q586.0,724.0 586.0,731.0 L586.0,750.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="348.0" y="0.0" width="504.0" height="104.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(364.0,14.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="398.0" y="36.0" font-size="21" font-weight="700" fill="#0B2A5B">k8s/base</text><text x="364.0" y="64.0" font-size="16.5" fill="#334155">Deployment, Service, HPA, PDB, NetworkPolicy, Ingress,</text><text x="364.0" y="85.0" font-size="16.5" fill="#334155">ServiceAccount</text><rect x="68.0" y="166.5" width="504.0" height="83.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(84.0,180.5) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="118.0" y="202.5" font-size="21" font-weight="700" fill="#0B2A5B">overlay dev</text><text x="84.0" y="230.5" font-size="16.5" fill="#334155">1 replica, small HPA, PDB minAvailable 0</text><rect x="628.0" y="156.0" width="504.0" height="104.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(644.0,170.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="678.0" y="192.0" font-size="21" font-weight="700" fill="#0B2A5B">overlay prod</text><text x="644.0" y="220.0" font-size="16.5" fill="#334155">3 replicas, HPA 3 to 10, PDB minAvailable 2, hard zone</text><text x="644.0" y="241.0" font-size="16.5" fill="#334155">spread, bigger limits</text><rect x="348.0" y="312.0" width="504.0" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(364.0,326.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="398.0" y="348.0" font-size="21" font-weight="700" fill="#053F3A">kustomize build</text><text x="364.0" y="376.0" font-size="16.5" fill="#334155">renders the final YAML per environment</text><circle cx="350.0" cy="314.0" r="15" fill="#0D9488" stroke="#fff" stroke-width="3"/><text x="350.0" y="320.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><rect x="68.0" y="510.0" width="317.3" height="125.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(84.0,524.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="118.0" y="546.0" font-size="21" font-weight="700" fill="#053F3A">kubeconform, strict</text><text x="84.0" y="574.0" font-size="16.5" fill="#334155">Kubernetes 1.31 schemas plus Argo</text><text x="84.0" y="595.0" font-size="16.5" fill="#334155">CD CRDs; catches wrong fields and</text><text x="84.0" y="616.0" font-size="16.5" fill="#334155">kinds</text><circle cx="70.0" cy="512.0" r="15" fill="#0D9488" stroke="#fff" stroke-width="3"/><text x="70.0" y="518.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><rect x="441.3" y="447.0" width="317.3" height="251.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(457.3,461.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="491.3" y="483.0" font-size="21" font-weight="700" fill="#053F3A">policy_check.py</text><text x="457.3" y="511.0" font-size="16.5" fill="#334155">non-root, read-only root filesystem,</text><text x="457.3" y="532.0" font-size="16.5" fill="#334155">no privilege escalation, drop ALL</text><text x="457.3" y="553.0" font-size="16.5" fill="#334155">capabilities, seccomp</text><text x="457.3" y="574.0" font-size="16.5" fill="#334155">RuntimeDefault, requests and limits,</text><text x="457.3" y="595.0" font-size="16.5" fill="#334155">probes, pinned image tag, HPA and</text><text x="457.3" y="616.0" font-size="16.5" fill="#334155">PDB exist, no host namespaces, no</text><text x="457.3" y="637.0" font-size="16.5" fill="#334155">SA token, default-deny</text><text x="457.3" y="658.0" font-size="16.5" fill="#334155">NetworkPolicy, namespace Pod</text><text x="457.3" y="679.0" font-size="16.5" fill="#334155">Security restricted</text><circle cx="443.3" cy="449.0" r="15" fill="#0D9488" stroke="#fff" stroke-width="3"/><text x="443.3" y="455.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><rect x="814.7" y="520.5" width="317.3" height="104.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(830.7,534.5) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="864.7" y="556.5" font-size="21" font-weight="700" fill="#4D2B00">test_policy_check.py</text><text x="830.7" y="584.5" font-size="16.5" fill="#334155">15 tests mutate good manifests and</text><text x="830.7" y="605.5" font-size="16.5" fill="#334155">expect the checker to reject them</text><rect x="68.0" y="750.0" width="690.7" height="64.0" rx="32.0" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(84.0,764.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="118.0" y="786.0" font-size="21" font-weight="700" fill="#06361A">All gates green: merge allowed</text></g><rect x="40" y="1045" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1081" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1109" r="3.6" fill="#94A3B8"/><text x="90" y="1119" font-size="18.5" fill="#1E293B">The checks run on the final YAML that Kustomize produces for each environment, not on the templates, so what is</text><text x="90" y="1145" font-size="18.5" fill="#1E293B">checked is exactly what would be applied.</text><circle cx="71" cy="1171" r="3.6" fill="#94A3B8"/><text x="90" y="1181" font-size="18.5" fill="#1E293B">The policy checker is itself tested: 15 tests take good manifests, break one thing, and require the checker to reject them.</text><text x="90" y="1207" font-size="18.5" fill="#1E293B">That shows the policy can actually fail.</text><rect x="40" y="1255" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="68" y="1271" font-size="15.5" fill="#334155">Manifests</text><rect x="165.21875" y="1255" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="193.21875" y="1271" font-size="15.5" fill="#334155">Render and gates</text><rect x="347.890625" y="1255" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="375.890625" y="1271" font-size="15.5" fill="#334155">Tests of the gates</text><rect x="532.75" y="1255" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="560.75" y="1271" font-size="15.5" fill="#334155">Merge allowed</text><text x="40" y="1305" font-size="14" fill="#94A3B8">Source: scripts/policy_check.py and scripts/test_policy_check.py</text></svg>
