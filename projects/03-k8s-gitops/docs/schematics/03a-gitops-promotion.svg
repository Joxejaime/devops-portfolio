<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1724" viewBox="0 0 1200 1724" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Promotion is a pull request; Git is the source of truth</title><desc id="d">Promotion is a pull request; Git is the source of truth. Dev syncs automatically, prod waits for a human, and rollback is a revert. Nobody applies manifests by hand. An engineer runs the promote workflow, which bumps the image tag, re-renders the manifests and checks them, then opens a pull request. Argo CD watches Git. It syncs dev by itself, but prod shows OutOfSync until a person presses Sync. To roll back, revert the pull request and sync again.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1722" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="234" height="30" rx="15" fill="#E6F0FF" stroke="#2563EB" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#0B2A5B">03 · KUBERNETES GITOPS</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Promotion is a pull request; Git is the source of truth</text><text x="40" y="151" font-size="21" fill="#475569">Dev syncs automatically, prod waits for a human, and rollback is a revert.</text><line x1="133.3" y1="277" x2="133.3" y2="1434" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="320.0" y1="277" x2="320.0" y2="1434" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="506.7" y1="277" x2="506.7" y2="1434" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="693.3" y1="277" x2="693.3" y2="1434" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="880.0" y1="277" x2="880.0" y2="1434" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="1066.7" y1="277" x2="1066.7" y2="1434" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><rect x="49.0" y="187" width="168.7" height="90" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(59.0,220.0) scale(1.000)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="89.0" y="238.0" font-size="17" font-weight="700" fill="#1E1B4B">Engineer</text><rect x="235.7" y="187" width="168.7" height="90" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(245.7,220.0) scale(1.000)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="275.7" y="216.0" font-size="17" font-weight="700" fill="#053F3A">GitHub</text><text x="275.7" y="238.0" font-size="17" font-weight="700" fill="#053F3A">Actions</text><text x="275.7" y="260.0" font-size="17" font-weight="700" fill="#053F3A">(workflow 03)</text><rect x="422.3" y="187" width="168.7" height="90" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(432.3,220.0) scale(1.000)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="462.3" y="227.0" font-size="17" font-weight="700" fill="#4D2B00">Git main</text><text x="462.3" y="249.0" font-size="17" font-weight="700" fill="#4D2B00">branch</text><rect x="609.0" y="187" width="168.7" height="90" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(619.0,220.0) scale(1.000)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="649.0" y="238.0" font-size="17" font-weight="700" fill="#0B2A5B">Argo CD</text><rect x="795.7" y="187" width="168.7" height="90" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(805.7,220.0) scale(1.000)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="835.7" y="227.0" font-size="17" font-weight="700" fill="#431407">Cluster:</text><text x="835.7" y="249.0" font-size="17" font-weight="700" fill="#431407">release-tracker-dev</text><rect x="982.3" y="187" width="168.7" height="90" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(992.3,220.0) scale(1.000)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="1022.3" y="227.0" font-size="17" font-weight="700" fill="#431407">Cluster:</text><text x="1022.3" y="249.0" font-size="17" font-weight="700" fill="#431407">release-tracker-prod</text><path d="M137.3,397.0 L318.0,397.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="240.7" y="308.0" text-anchor="middle" font-size="16.5" fill="#1E293B">Run workflow:</text><text x="240.7" y="329.0" text-anchor="middle" font-size="16.5" fill="#1E293B">environment and</text><text x="240.7" y="350.0" text-anchor="middle" font-size="16.5" fill="#1E293B">image_tag =</text><text x="240.7" y="371.0" text-anchor="middle" font-size="16.5" fill="#1E293B">sha-40hex</text><circle cx="157.3" cy="397.0" r="13" fill="#6366F1" stroke="#fff" stroke-width="2.5"/><text x="157.3" y="402.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">1</text><rect x="336.0" y="419.0" width="398.9" height="60" rx="12" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M320.0,449.0 L336.0,449.0" stroke="#0D9488" stroke-width="2"/><circle cx="358.0" cy="449.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="358.0" y="454.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">2</text><text x="382.0" y="444.0" font-size="16.5" fill="#1E293B">validate and policy-tests jobs run on current</text><text x="382.0" y="465.0" font-size="16.5" fill="#1E293B">main</text><rect x="336.0" y="497.0" width="391.8" height="40" rx="12" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M320.0,517.0 L336.0,517.0" stroke="#0D9488" stroke-width="2"/><circle cx="358.0" cy="517.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="358.0" y="522.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">3</text><text x="382.0" y="522.5" font-size="16.5" fill="#1E293B">check tag format, kustomize edit set image</text><rect x="336.0" y="555.0" width="408.4" height="60" rx="12" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M320.0,585.0 L336.0,585.0" stroke="#0D9488" stroke-width="2"/><circle cx="358.0" cy="585.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="358.0" y="590.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">4</text><text x="382.0" y="580.0" font-size="16.5" fill="#1E293B">re-render the bumped overlay: kubeconform,</text><text x="382.0" y="601.0" font-size="16.5" fill="#1E293B">policy_check.py</text><path d="M324.0,714.0 L504.7,714.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="427.3" y="646.0" text-anchor="middle" font-size="16.5" fill="#1E293B">open a promotion pull</text><text x="427.3" y="667.0" text-anchor="middle" font-size="16.5" fill="#1E293B">request (only if all</text><text x="427.3" y="688.0" text-anchor="middle" font-size="16.5" fill="#1E293B">checks passed)</text><circle cx="344.0" cy="714.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="344.0" y="719.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">5</text><path d="M137.3,775.0 L504.7,775.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="334.0" y="749.0" text-anchor="middle" font-size="16.5" fill="#1E293B">review the checks, merge the PR</text><circle cx="157.3" cy="775.0" r="13" fill="#6366F1" stroke="#fff" stroke-width="2.5"/><text x="157.3" y="780.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">6</text><path d="M689.3,878.0 L508.7,878.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="586.0" y="810.0" text-anchor="middle" font-size="16.5" fill="#1E293B">poll or webhook:</text><text x="586.0" y="831.0" text-anchor="middle" font-size="16.5" fill="#1E293B">sees the new overlay</text><text x="586.0" y="852.0" text-anchor="middle" font-size="16.5" fill="#1E293B">commit</text><circle cx="669.3" cy="878.0" r="13" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="669.3" y="883.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">7</text><line x1="40" y1="908" x2="1160" y2="908" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="40" y="896" width="220.1" height="26" rx="13" fill="#E2F8E8" stroke="#16A34A" stroke-width="1.6"/><text x="54" y="914" font-size="15" font-weight="700" fill="#06361A">If the dev overlay changed</text><path d="M697.3,1004.0 L878.0,1004.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="800.7" y="957.0" text-anchor="middle" font-size="16.5" fill="#1E293B">automated sync with</text><text x="800.7" y="978.0" text-anchor="middle" font-size="16.5" fill="#1E293B">prune and selfHeal</text><circle cx="717.3" cy="1004.0" r="13" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="717.3" y="1009.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">8</text><path d="M876.0,1065.0 L695.3,1065.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="772.7" y="1039.0" text-anchor="middle" font-size="16.5" fill="#1E293B">Healthy</text><circle cx="856.0" cy="1065.0" r="13" fill="#EA580C" stroke="#fff" stroke-width="2.5"/><text x="856.0" y="1070.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">9</text><line x1="40" y1="1095" x2="1160" y2="1095" stroke="#E11D48" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="40" y="1083" width="226.8" height="26" rx="13" fill="#FFE8EC" stroke="#E11D48" stroke-width="1.6"/><text x="54" y="1101" font-size="15" font-weight="700" fill="#6B0A20">If the prod overlay changed</text><path d="M689.3,1170.0 L135.3,1170.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="399.3" y="1144.0" text-anchor="middle" font-size="16.5" fill="#1E293B">OutOfSync, waiting for a human</text><circle cx="669.3" cy="1170.0" r="13" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="669.3" y="1175.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">10</text><path d="M137.3,1231.0 L691.3,1231.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="427.3" y="1205.0" text-anchor="middle" font-size="16.5" fill="#1E293B">press Sync, or run argocd app sync</text><circle cx="157.3" cy="1231.0" r="13" fill="#6366F1" stroke="#fff" stroke-width="2.5"/><text x="157.3" y="1236.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">11</text><path d="M697.3,1292.0 L1064.7,1292.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="894.0" y="1266.0" text-anchor="middle" font-size="16.5" fill="#1E293B">apply with ServerSideApply</text><circle cx="717.3" cy="1292.0" r="13" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="717.3" y="1297.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">12</text><path d="M1062.7,1353.0 L695.3,1353.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="866.0" y="1327.0" text-anchor="middle" font-size="16.5" fill="#1E293B">Healthy</text><circle cx="1042.7" cy="1353.0" r="13" fill="#EA580C" stroke="#fff" stroke-width="2.5"/><text x="1042.7" y="1358.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">13</text><rect x="55.3" y="1373.0" width="1089.3" height="41" rx="12" fill="#FFF4D6" stroke="#D97706" stroke-width="1.6"/><text x="600.0" y="1399.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#4D2B00">Rollback = revert the promotion PR, then sync</text><rect x="40" y="1464" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1500" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1528" r="3.6" fill="#94A3B8"/><text x="90" y="1538" font-size="18.5" fill="#1E293B">Nobody applies manifests by hand. An engineer runs the promote workflow, which bumps the image tag, re-renders the</text><text x="90" y="1564" font-size="18.5" fill="#1E293B">manifests and checks them, then opens a pull request.</text><circle cx="71" cy="1590" r="3.6" fill="#94A3B8"/><text x="90" y="1600" font-size="18.5" fill="#1E293B">Argo CD watches Git. It syncs dev by itself, but prod shows OutOfSync until a person presses Sync. To roll back, revert</text><text x="90" y="1626" font-size="18.5" fill="#1E293B">the pull request and sync again.</text><text x="40" y="1688" font-size="14" fill="#94A3B8">Source: .github/workflows/03-k8s-gitops.yml and argocd/</text></svg>
