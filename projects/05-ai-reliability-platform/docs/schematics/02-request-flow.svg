<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1494" viewBox="0 0 1200 1494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Every request takes one of six paths, and each one is measured</title><desc id="d">Every request takes one of six paths, and each one is measured. Limits first, then cache, then the primary provider, then the fallback. The gateway answers the cheapest questions first: is this tenant over its rate limit, is the token budget used up, is the answer already cached. Only then does it call the primary provider, with retries, jittered backoff and a 2 second deadline. If the primary fails or its circuit is open, the fallback gets the same treatment. Each ending is a label on gateway_requests_total, which the SLO is computed from.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1492" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="273" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#1E1B4B">05 · AI RELIABILITY PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Every request takes one of six paths, and each one is</text><text x="40" y="158" font-size="38" font-weight="700" fill="#0F172A">measured</text><text x="40" y="195" font-size="21" fill="#475569">Limits first, then cache, then the primary provider, then the fallback.</text><g transform="translate(0,235.0)"><path d="M600.0,64.0 L600.0,116.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M738.7,157.0 L834.7,157.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="768.4" y="142.0" width="36.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="786.7" y="161.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">no</text><path d="M600.0,198.0 L600.0,250.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="578.2" y="209.0" width="43.6" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="228.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">yes</text><path d="M738.7,291.0 L834.7,291.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="768.4" y="276.0" width="36.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="786.7" y="295.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">no</text><path d="M600.0,332.0 L600.0,384.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="578.2" y="343.0" width="43.6" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="362.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">yes</text><path d="M738.7,416.0 L834.7,416.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="764.8" y="401.0" width="43.6" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="786.7" y="420.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">yes</text><path d="M600.0,448.0 L600.0,510.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="581.8" y="464.2" width="36.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="483.2" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">no</text><path d="M738.7,573.0 L834.7,573.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="747.4" y="558.0" width="78.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="786.7" y="577.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">success</text><path d="M600.0,635.5 L600.0,698.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="515.8" y="651.8" width="168.4" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="670.8" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">failed or circuit open</text><path d="M738.7,739.5 L834.7,739.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="747.4" y="724.5" width="78.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="786.7" y="743.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">success</text><path d="M600.0,781.0 L600.0,833.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="570.9" y="792.0" width="58.2" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="811.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">failed</text><path d="M365.3,573.0 L461.3,573.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="461.3" y="0.0" width="277.3" height="64.0" rx="32.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(477.3,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="511.3" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">POST /v1/chat</text><polygon points="483.3,116.0 716.7,116.0 738.7,157.0 716.7,198.0 483.3,198.0 461.3,157.0" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(495.3,130.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="529.3" y="152.0" font-size="21" font-weight="700" fill="#053F3A">Under the tenant</text><text x="529.3" y="178.0" font-size="21" font-weight="700" fill="#053F3A">rate limit?</text><rect x="834.7" y="125.0" width="277.3" height="64.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(850.7,139.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="884.7" y="161.0" font-size="21" font-weight="700" fill="#6B0A20">429 rate_limited</text><polygon points="483.3,250.0 716.7,250.0 738.7,291.0 716.7,332.0 483.3,332.0 461.3,291.0" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(495.3,264.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="529.3" y="286.0" font-size="21" font-weight="700" fill="#053F3A">Token budget</text><text x="529.3" y="312.0" font-size="21" font-weight="700" fill="#053F3A">left?</text><rect x="834.7" y="250.0" width="277.3" height="82.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(850.7,264.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="884.7" y="286.0" font-size="21" font-weight="700" fill="#6B0A20">429</text><text x="884.7" y="312.0" font-size="21" font-weight="700" fill="#6B0A20">budget_exceeded</text><polygon points="483.3,384.0 716.7,384.0 738.7,416.0 716.7,448.0 483.3,448.0 461.3,416.0" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(495.3,398.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="529.3" y="420.0" font-size="21" font-weight="700" fill="#053F3A">Cache hit?</text><rect x="834.7" y="384.0" width="277.3" height="64.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(850.7,398.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="884.7" y="420.0" font-size="21" font-weight="700" fill="#06361A">200 cached</text><rect x="461.3" y="510.5" width="277.3" height="125.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(477.3,524.5) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="511.3" y="546.5" font-size="21" font-weight="700" fill="#0B2A5B">Primary provider</text><text x="477.3" y="574.5" font-size="16.5" fill="#334155">circuit breaker check, up to 3</text><text x="477.3" y="595.5" font-size="16.5" fill="#334155">attempts, jittered backoff, 2 s</text><text x="477.3" y="616.5" font-size="16.5" fill="#334155">deadline</text><rect x="834.7" y="521.0" width="277.3" height="104.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(850.7,535.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="884.7" y="557.0" font-size="21" font-weight="700" fill="#06361A">200 ok</text><text x="850.7" y="585.0" font-size="16.5" fill="#334155">cache the answer and charge</text><text x="850.7" y="606.0" font-size="16.5" fill="#334155">tokens</text><rect x="461.3" y="698.0" width="277.3" height="83.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(477.3,712.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="511.3" y="734.0" font-size="21" font-weight="700" fill="#0B2A5B">Fallback provider</text><text x="477.3" y="762.0" font-size="16.5" fill="#334155">same retries and breaker</text><rect x="834.7" y="698.0" width="277.3" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(850.7,712.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="884.7" y="734.0" font-size="21" font-weight="700" fill="#4D2B00">200 degraded</text><text x="850.7" y="762.0" font-size="16.5" fill="#334155">served by the fallback</text><rect x="386.7" y="833.0" width="426.7" height="64.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(402.7,847.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="436.7" y="869.0" font-size="21" font-weight="700" fill="#6B0A20">503 upstream_unavailable</text><rect x="88.0" y="500.0" width="277.3" height="146.0" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/><g transform="translate(104.0,514.0) scale(1.083)" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text x="138.0" y="536.0" font-size="21" font-weight="700" fill="#0F172A">Defaults</text><text x="104.0" y="564.0" font-size="16.5" fill="#334155">2.0 s request deadline, 0.8 s</text><text x="104.0" y="585.0" font-size="16.5" fill="#334155">per attempt, 3 attempts per</text><text x="104.0" y="606.0" font-size="16.5" fill="#334155">provider, full-jitter backoff</text><text x="104.0" y="627.0" font-size="16.5" fill="#334155">(base 0.05 s, cap 0.4 s)</text></g><rect x="40" y="1172" width="1120" height="214" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1208" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1236" r="3.6" fill="#94A3B8"/><text x="90" y="1246" font-size="18.5" fill="#1E293B">The gateway answers the cheapest questions first: is this tenant over its rate limit, is the token budget used up, is the</text><text x="90" y="1272" font-size="18.5" fill="#1E293B">answer already cached.</text><circle cx="71" cy="1298" r="3.6" fill="#94A3B8"/><text x="90" y="1308" font-size="18.5" fill="#1E293B">Only then does it call the primary provider, with retries, jittered backoff and a 2 second deadline. If the primary fails or</text><text x="90" y="1334" font-size="18.5" fill="#1E293B">its circuit is open, the fallback gets the same treatment. Each ending is a label on gateway_requests_total, which the</text><text x="90" y="1360" font-size="18.5" fill="#1E293B">SLO is computed from.</text><rect x="40" y="1408" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1424" font-size="15.5" fill="#334155">Request</text><rect x="153.71875" y="1408" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="181.71875" y="1424" font-size="15.5" fill="#334155">Check</text><rect x="254.609375" y="1408" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="282.609375" y="1424" font-size="15.5" fill="#334155">Provider call</text><rect x="399.484375" y="1408" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="427.484375" y="1424" font-size="15.5" fill="#334155">Success</text><rect x="515.71875" y="1408" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="543.71875" y="1424" font-size="15.5" fill="#334155">Fallback success</text><rect x="695.25" y="1408" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="723.25" y="1424" font-size="15.5" fill="#334155">Rejected</text><text x="40" y="1458" font-size="14" fill="#94A3B8">Source: gateway/router.py</text></svg>
