<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1543" viewBox="0 0 1200 1543" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The AWS deployment: private tasks behind a load balancer</title><desc id="d">The AWS deployment: private tasks behind a load balancer. ECS Fargate, ALB, NAT, autoscaling and four CloudWatch alarms, all in Terraform (planned for Juega App once it reaches 5,000 users). This is what the Terraform in this project declares. It is validated in CI and planned for Juega App once that app reaches 5,000 users; it is not applied yet. Without a certificate the load balancer forwards plain HTTP on port 80. With one it serves HTTPS on 443 and port 80 redirects to it. The tasks sit in private subnets and reach the outside only through the NAT gateway on port 443.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1541" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="273" height="30" rx="15" fill="#FFEEDC" stroke="#EA580C" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#431407">05 · AI RELIABILITY PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">The AWS deployment: private tasks behind a load balancer</text><text x="40" y="151" font-size="21" fill="#475569">ECS Fargate, ALB, NAT, autoscaling and four CloudWatch alarms, all in Terraform (planned for Juega App once it</text><text x="40" y="180" font-size="21" fill="#475569">reaches 5,000 users).</text><g transform="translate(0,220.0)"><rect x="428.3" y="136.0" width="716.7" height="505.5" rx="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><rect x="434.3" y="188.0" width="704.7" height="187.0" rx="20" fill="#FFF8F1" stroke="#EA580C" stroke-width="1.6"/><rect x="434.3" y="453.5" width="331.3" height="182.0" rx="20" fill="#F3F8FF" stroke="#2563EB" stroke-width="1.6"/><path d="M600.0,64.0 L600.0,242.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,351.0 L600.0,507.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="503.1" y="414.2" width="193.9" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="433.2" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">ALB security group only</text><path d="M741.7,559.5 L904.7,559.5 Q916.7,559.5 916.7,547.5 L916.7,328.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="848.2" y="429.0" width="136.8" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="916.7" y="448.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">egress 443 only</text><path d="M1030.0,328.5 L1030.0,525.2 Q1030.0,537.2 1018.0,537.2 L985.3,537.2 Q973.3,537.2 973.3,549.2 L973.3,746.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M368.3,559.5 L458.3,559.5" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M600.0,611.5 L600.0,722.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M600.0,852.0 L600.0,904.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="436.3" y="144.0" width="57.2" height="26" rx="13" fill="#F8FAFC"/><text x="447.3" y="163.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#64748B">VPC</text><rect x="442.3" y="196.0" width="167.7" height="26" rx="13" fill="#FFF8F1"/><text x="453.3" y="215.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#EA580C">PUBLIC SUBNETS</text><rect x="442.3" y="461.5" width="176.5" height="26" rx="13" fill="#F3F8FF"/><text x="453.3" y="480.5" font-size="15" font-weight="700" letter-spacing="1.2" fill="#2563EB">PRIVATE SUBNETS</text><rect x="458.3" y="0.0" width="283.3" height="64.0" rx="32.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(474.3,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="508.3" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">Internet clients</text><rect x="458.3" y="242.0" width="283.3" height="109.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(474.3,256.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="508.3" y="278.0" font-size="21" font-weight="700" fill="#431407">Application Load</text><text x="508.3" y="304.0" font-size="21" font-weight="700" fill="#431407">Balancer</text><text x="474.3" y="332.0" font-size="16.5" fill="#334155">:80, plus :443 with a certificate</text><rect x="831.7" y="264.5" width="283.3" height="64.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(847.7,278.5) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="881.7" y="300.5" font-size="21" font-weight="700" fill="#431407">NAT gateway</text><path d="M85.0,488.0 v143.0 a141.7,11 0 0 0 283.3,0 v-143.0 a141.7,11 0 0 0 -283.3,0 z" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><path d="M85.0,488.0 a141.7,11 0 0 0 283.3,0" fill="none" stroke="#D97706" stroke-width="2.2"/><g transform="translate(101.0,501.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="135.0" y="523.0" font-size="21" font-weight="700" fill="#4D2B00">Supporting</text><text x="135.0" y="549.0" font-size="21" font-weight="700" fill="#4D2B00">resources</text><text x="101.0" y="577.0" font-size="16.5" fill="#334155">ECR repository, CloudWatch</text><text x="101.0" y="598.0" font-size="16.5" fill="#334155">logs, Auto Scaling on CPU, IAM</text><text x="101.0" y="619.0" font-size="16.5" fill="#334155">roles</text><rect x="458.3" y="507.5" width="283.3" height="104.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(474.3,521.5) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="508.3" y="543.5" font-size="21" font-weight="700" fill="#0B2A5B">ECS Fargate tasks</text><text x="474.3" y="571.5" font-size="16.5" fill="#334155">two tasks shown, scaled by</text><text x="474.3" y="592.5" font-size="16.5" fill="#334155">CPU</text><rect x="831.7" y="746.0" width="283.3" height="82.0" rx="41.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(847.7,760.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="881.7" y="782.0" font-size="21" font-weight="700" fill="#1E1B4B">Provider and AWS</text><text x="881.7" y="808.0" font-size="21" font-weight="700" fill="#1E1B4B">APIs</text><rect x="458.3" y="722.0" width="283.3" height="130.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(474.3,736.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="508.3" y="758