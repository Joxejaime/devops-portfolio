<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="943" viewBox="0 0 1200 943" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">A circuit breaker stops hammering a provider that is down</title><desc id="d">A circuit breaker stops hammering a provider that is down. Five failures open it. After 15 seconds one probe call decides whether to close it. While the provider is healthy the breaker stays closed and calls flow. Five failures in a row open it, so calls are rejected immediately and traffic goes to the fallback. After 15 seconds it lets one probe call through. If the probe works the breaker closes again by itself. If it fails the breaker opens again. A provider rejecting a bad request counts as a success, because that says nothing about its health.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="941" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="273" height="30" rx="15" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#053F3A">05 · AI RELIABILITY PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">A circuit breaker stops hammering a provider that is down</text><text x="40" y="151" font-size="21" fill="#475569">Five failures open it. After 15 seconds one probe call decides whether to close it.</text><g transform="translate(0,191.0)"><path d="M338.3,62.5 L861.7,62.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="510.7" y="47.5" width="178.7" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="66.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">5 consecutive failures</text><path d="M928.7,125.0 L928.7,189.9 Q928.7,201.9 916.7,201.9 L711.7,201.9" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="767.4" y="186.9" width="105.6" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="820.2" y="205.9" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">15 s timeout</text><path d="M711.7,239.2 L1006.0,239.2 Q1018.0,239.2 1018.0,227.2 L1018.0,125.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="802.5" y="224.2" width="124.7" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="864.8" y="243.2" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">probe call fails</text><path d="M488.3,218.5 L238.7,218.5 Q226.7,218.5 226.7,206.5 L226.7,104.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="274.7" y="203.5" width="165.6" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="357.5" y="222.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">probe call succeeds</text><rect x="115.0" y="21.0" width="223.3" height="83.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(131.0,35.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="165.0" y="57.0" font-size="21" font-weight="700" fill="#06361A">CLOSED</text><text x="131.0" y="85.0" font-size="16.5" fill="#334155">calls flow normally</text><rect x="861.7" y="0.0" width="223.3" height="125.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(877.7,14.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></g><text x="911.7" y="36.0" font-size="21" font-weight="700" fill="#6B0A20">OPEN</text><text x="877.7" y="64.0" font-size="16.5" fill="#334155">calls rejected</text><text x="877.7" y="85.0" font-size="16.5" fill="#334155">immediately; traffic</text><text x="877.7" y="106.0" font-size="16.5" fill="#334155">goes to the fallback</text><rect x="488.3" y="177.0" width="223.3" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(504.3,191.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text x="538.3" y="213.0" font-size="21" font-weight="700" fill="#4D2B00">HALF_OPEN</text><text x="504.3" y="241.0" font-size="16.5" fill="#334155">one probe call allowed</text><rect x="115.0" y="312.0" width="970.0" height="104.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(131.0,326.0) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="165.0" y="348.0" font-size="21" font-weight="700" fill="#2E1065">Alert</text><text x="131.0" y="376.0" font-size="16.5" fill="#334155">PrimaryProviderCircuitOpen fires when the primary stays in state 2 (open) for 1 minute. gateway_circuit_state exports</text><text x="131.0" y="397.0" font-size="16.5" fill="#334155">the numeric state.</text></g><rect x="40" y="647" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="683" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="711" r="3.6" fill="#94A3B8"/><text x="90" y="721" font-size="18.5" fill="#1E293B">While the provider is healthy the breaker stays closed and calls flow. Five failures in a row open it, so calls are rejected</text><text x="90" y="747" font-size="18.5" fill="#1E293B">immediately and traffic goes to the fallback.</text><circle cx="71" cy="773" r="3.6" fill="#94A3B8"/><text x="90" y="783" font-size="18.5" fill="#1E293B">After 15 seconds it lets one probe call through. If the probe works the breaker closes again by itself. If it fails the breaker</text><text x="90" y="809" font-size="18.5" fill="#1E293B">opens again. A provider rejecting a bad request counts as a success, because that says nothing about its health.</text><rect x="40" y="857" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="68" y="873" font-size="15.5" fill="#334155">Calls flow</text><rect x="165.265625" y="857" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="193.265625" y="873" font-size="15.5" fill="#334155">Calls rejected</text><rect x="319.03125" y="857" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="347.03125" y="873" font-size="15.5" fill="#334155">One probe allowed</text><text x="40" y="907" font-size="14" fill="#94A3B8">Source: gateway/resilience.py, defaults in gateway/config.py</text></svg>
