<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1347" viewBox="0 0 1200 1347" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">An AI gateway built to keep answering when a provider fails</title><desc id="d">An AI gateway built to keep answering when a provider fails. Rate limits, budgets, cache, two providers, metrics and SLO alerts in one small service. Every request passes through limits and a cache, then goes to the primary provider. If that provider is failing, its circuit breaker opens and the request goes to the fallback instead. The gateway is one small Python process. Prometheus scrapes it, alert rules watch the SLO, and the alerts link to runbooks. Both providers are mocks, so this shows behaviour, not real capacity.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1345" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="273" height="30" rx="15" fill="#E6F0FF" stroke="#2563EB" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#0B2A5B">05 · AI RELIABILITY PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">An AI gateway built to keep answering when a provider fails</text><text x="40" y="151" font-size="21" fill="#475569">Rate limits, budgets, cache, two providers, metrics and SLO alerts in one small service.</text><g transform="translate(0,191.0)"><rect x="40.0" y="182.0" width="739.2" height="452.0" rx="20" fill="#F3F8FF" stroke="#2563EB" stroke-width="1.6"/><rect x="913.6" y="182.0" width="246.4" height="452.0" rx="20" fill="#F8F5FF" stroke="#7C3AED" stroke-width="1.6"/><path d="M443.2,104.0 L443.2,236.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M443.2,319.0 L443.2,381.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M443.2,464.5 L443.2,483.8 Q443.2,495.8 431.2,495.8 L197.6,495.8 Q185.6,495.8 185.6,507.8 L185.6,527.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M443.2,464.5 L443.2,483.8 Q443.2,495.8 455.2,495.8 L621.6,495.8 Q633.6,495.8 633.6,507.8 L633.6,527.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M185.6,610.0 L185.6,713.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M633.6,610.0 L633.6,713.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M598.4,277.5 L937.6,277.5" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="728.9" y="262.5" width="78.1" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="768.0" y="281.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">/metrics</text><path d="M1036.8,319.0 L1036.8,371.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M1136.0,423.0 L1156.0,423.0 Q1168.0,423.0 1168.0,435.0 L1168.0,743.0 Q1168.0,755.0 1156.0,755.0 L1136.0,755.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M1036.8,475.0 L1036.8,527.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="48.0" y="190.0" width="188.5" height="26" rx="13" fill="#F3F8FF"/><text x="59.0" y="209.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#2563EB">GATEWAY PROCESS</text><rect x="921.6" y="190.0" width="155.5" height="26" rx="13" fill="#F8F5FF"/><text x="932.6" y="209.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#7C3AED">OBSERVABILITY</text><rect x="288.0" y="0.0" width="310.4" height="104.0" rx="52.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(304.0,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="338.0" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">Client or tenant</text><text x="304.0" y="64.0" font-size="16.5" fill="#334155">POST /v1/chat with an X-Tenant</text><text x="304.0" y="85.0" font-size="16.5" fill="#334155">header</text><rect x="288.0" y="236.0" width="310.4" height="83.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(304.0,250.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="338.0" y="272.0" font-size="21" font-weight="700" fill="#0B2A5B">HTTP server</text><text x="304.0" y="300.0" font-size="16.5" fill="#334155">/v1/chat, /healthz, /readyz, /metrics</text><rect x="288.0" y="381.5" width="310.4" height="83.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(304.0,395.5) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="338.0" y="417.5" font-size="21" font-weight="700" fill="#0B2A5B">Router</text><text x="304.0" y="445.5" font-size="16.5" fill="#334155">rate limit, token budget, cache</text><rect x="64.0" y="527.0" width="243.2" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(80.0,541.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="114.0" y="563.0" font-size="21" font-weight="700" fill="#053F3A">Circuit breaker</text><text x="80.0" y="591.0" font-size="16.5" fi