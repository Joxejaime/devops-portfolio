<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1291" viewBox="0 0 1200 1291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Every change is linted, tested, scanned and validated</title><desc id="d">Every change is linted, tested, scanned and validated. Tests, Terraform checks and a Trivy image scan run before anything is released. On every push or pull request that touches this project, the test job and the Terraform job run side by side. The image job starts only after the tests pass. Nothing is published by an ordinary merge. Only a tag named ai-reliability-platform-vX.Y.Z pushes the image to GHCR, with provenance and an SBOM.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1289" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="273" height="30" rx="15" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#053F3A">05 · AI RELIABILITY PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Every change is linted, tested, scanned and validated</text><text x="40" y="151" font-size="21" fill="#475569">Tests, Terraform checks and a Trivy image scan run before anything is released.</text><g transform="translate(0,191.0)"><path d="M600.0,64.0 L600.0,78.0 Q600.0,90.0 588.0,90.0 L332.0,90.0 Q320.0,90.0 320.0,102.0 L320.0,116.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,64.0 L600.0,83.2 Q600.0,95.2 612.0,95.2 L868.0,95.2 Q880.0,95.2 880.0,107.2 L880.0,126.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M320.0,220.0 L320.0,272.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#a