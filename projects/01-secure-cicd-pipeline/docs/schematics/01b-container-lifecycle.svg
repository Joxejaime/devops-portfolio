<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1526" viewBox="0 0 1200 1526" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Drains before it stops</title><desc id="d">Drains before it stops. On SIGTERM readiness flips to 503 first, so traffic leaves before the process exits. Liveness asks whether the process is alive. Readiness asks whether it should receive traffic. They are separate on purpose. On a deploy or scale-in the app first says it is not ready, waits for the load balancer to move traffic away, finishes the requests already running, and only then exits.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1524" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="251" height="30" rx="15" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#053F3A">01 · SECURE CI/CD PIPELINE</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Drains before it stops</text><text x="40" y="151" font-size="21" fill="#475569">On SIGTERM readiness flips to 503 first, so traffic leaves before the process exits.</text><line x1="226.7" y1="255" x2="226.7" y2="1236" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="600.0" y1="255" x2="600.0" y2="1236" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="973.3" y1="255" x2="973.3" y2="1236" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><rect x="126.7" y="187" width="200.0" height="68" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(136.7,209.0) scale(1.000)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="166.7" y="216.0" font-size="17" font-weight="700" fill="#0B2A5B">Load balancer or</text><text x="166.7" y="238.0" font-size="17" font-weight="700" fill="#0B2A5B">kubelet</text><rect x="500.0" y="187" width="200.0" height="68" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(510.0,209.0) scale(1.000)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="540.0" y="216.0" font-size="17" font-weight="700" fill="#053F3A">release-tracker</text><text x="540.0" y="238.0" font-size="17" font-weight="700" fill="#053F3A">process</text><rect x="873.3" y="187" width="200.0" height="68" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(883.3,209.0) scale(1.000)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="913.3" y="227.0" font-size="17" font-weight="700" fill="#2E1065">Prometheus</text><rect x="148.7" y="271.0" width="902.7" height="41" rx="12" fill="#FFF4D6" stroke="#D97706" stroke-width="1.6"/><text x="600.0" y="297.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#4D2B00">Starts with PORT, APP_VERSION and SHUTDOWN_GRACE_SECONDS</text><path d="M230.7,369.0 L598.0,369.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="427.3" y="343.0" text-anchor="middle" font-size="16.5" fill="#1E293B">GET /healthz (liveness)</text><circle cx="250.7" cy="369.0" r="13" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="250.7" y="374.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">1</text><path d="M596.0,430.0 L228.7,430.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="399.3" y="404.0" text-anchor="middle" font-size="16.5" fill="#1E293B">200 ok</text><circle cx="576.0" cy="430.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="576.0" y="435.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">2</text><path d="M230.7,491.0 L598.0,491.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="427.3" y="465.0" text-anchor="middle" font-size="16.5" fill="#1E293B">GET /readyz (readiness)</text><circle cx="250.7" cy="491.0" r="13" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="250.7" y="496.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">3</text><path d="M596.0,552.0 L228.7,552.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="399.3" y="526.0" text-anchor="middle" font-size="16.5" fill="#1E293B">200 ready</text><circle cx="576.0" cy="552.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="576.0" y="557.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">4</text><rect x="148.7" y="572.0" width="902.7" height="41" rx="12" fill="#FFF4D6" stroke="#D97706" stroke-width="1.6"/><text x="600.0" y="598.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#4D2B00">Traffic flows. Each request gets an X-Request-Id, one JSON log line and a latency histogram sample</text><path d="M969.3,670.0 L602.0,670.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="772.7" y="644.0" text-anchor="middle" font-size="16.5" fill="#1E293B">GET /metrics every 15 s</text><circle cx="949.3" cy="670.0" r="13" fill="#7C3AED" stroke="#fff" stroke-width="2.5"/><text x="949.3" y="675.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">5</text><path d="M604.0,731.0 L971.3,731.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="800.7" y="705.0" text-anchor="middle" font-size="16.5" fill="#1E293B">counters, histogram buckets, app_info</text><circle cx="624.0" cy="731.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="624.0" y="736.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">6</text><line x1="40" y1="761" x2="1160" y2="761" stroke="#E11D48" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="40" y="749" width="278.6" height="26" rx="13" fill="#FFE8EC" stroke="#E11D48" stroke-width="1.6"/><text x="54" y="767" font-size="15" font-weight="700" fill="#6B0A20">Deploy or scale-in sends SIGTERM</text><path d="M230.7,836.0 L598.0,836.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="427.3" y="810.0" text-anchor="middle" font-size="16.5" fill="#1E293B">SIGTERM</text><circle cx="250.7" cy="836.0" r="13" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="250.7" y="841.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">7</text><rect x="169.9" y="858.0" width="414.1" height="60" rx="12" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M600.0,888.0 L584.0,888.0" stroke="#0D9488" stroke-width="2"/><circle cx="562.0" cy="888.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="562.0" y="893.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">8</text><text x="183.9" y="883.0" font-size="16.5" fill="#1E293B">Readiness flag turns false and the grace timer</text><text x="183.9" y="904.0" font-size="16.5" fill="#1E293B">starts</text><path d="M230.7,975.0 L598.0,975.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="427.3" y="949.0" text-anchor="middle" font-size="16.5" fill="#1E293B">GET /readyz</text><circle cx="250.7" cy="975.0" r="13" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="250.7" y="980.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">9</text><path d="M596.0,1036.0 L228.7,1036.0" stroke="#E11D48" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="399.3" y="1010.0" text-anchor="middle" font-size="16.5" fill="#1E293B">503 shutting_down</text><circle cx="576.0" cy="1036.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="576.0" y="1041.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">10</text><rect x="148.7" y="1056.0" width="902.7" height="41" rx="12" fill="#E2F8E8" stroke="#16A34A" stroke-width="1.6"/><text x="600.0" y="1082.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#06361A">Removed from rotation while in-flight requests finish</text><rect x="224.4" y="1115.0" width="359.6" height="40" rx="12" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M600.0,1135.0 L584.0,1135.0" stroke="#0D9488" stroke-width="2"/><circle cx="562.0" cy="1135.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="562.0" y="1140.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">11</text><text x="238.4" y="1140.5" font-size="16.5" fill="#1E293B">Grace timer expires, server.shutdown()</text><path d="M596.0,1212.0 L228.7,1212.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="399.3" y="1186.0" text-anchor="middle" font-size="16.5" fill="#1E293B">process exits cleanly</text><circle cx="576.0" cy="1212.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="576.0" y="1217.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">12</text><rect x="40" y="1266" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1302" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1330" r="3.6" fill="#94A3B8"/><text x="90" y="1340" font-size="18.5" fill="#1E293B">Liveness asks whether the process is alive. Readiness asks whether it should receive traffic. They are separate on</text><text x="90" y="1366" font-size="18.5" fill="#1E293B">purpose.</text><circle cx="71" cy="1392" r="3.6" fill="#94A3B8"/><text x="90" y="1402" font-size="18.5" fill="#1E293B">On a deploy or scale-in the app first says it is not ready, waits for the load balancer to move traffic away, finishes the</text><text x="90" y="1428" font-size="18.5" fill="#1E293B">requests already running, and only then exits.</text><text x="40" y="1490" font-size="14" fill="#94A3B8">Source: app/server.py</text></svg>
