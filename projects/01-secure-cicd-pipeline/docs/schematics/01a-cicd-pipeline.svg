<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1321" viewBox="0 0 1200 1321" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">A merge cannot publish unless every gate is green</title><desc id="d">A merge cannot publish unless every gate is green. Lint, test, scan and secret-scan run first; only main publishes, signs and attests. Every pull request runs three checks at the same time, then builds the image without publishing it, starts it, and scans it. A fixable HIGH or CRITICAL vulnerability stops the run. Only a merge to main goes on to publish. The image is pushed by digest, signed with cosign without any stored key, and given a provenance record, so each release can be traced to its commit.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1319" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="251" height="30" rx="15" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#053F3A">01 · SECURE CI/CD PIPELINE</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">A merge cannot publish unless every gate is green</text><text x="40" y="151" font-size="21" fill="#475569">Lint, test, scan and secret-scan run first; only main publishes, signs and attests.</text><g transform="translate(0,191.0)"><rect x="44.0" y="291.0" width="1112.0" height="317.0" rx="20" fill="#F3F8FF" stroke="#2563EB" stroke-width="1.6"/><rect x="44.0" y="636.0" width="1112.0" height="182.0" rx="20" fill="#FFF8F1" stroke="#EA580C" stroke-width="1.6"/><rect x="44.0" y="102.0" width="1112.0" height="161.0" rx="20" fill="#F2FCFA" stroke="#0D9488" stroke-width="1.6"/><path d="M600.0,64.0 L600.0,98.0 Q600.0,110.0 588.0,110.0 L238.7,110.0 Q226.7,110.0 226.7,122.0 L226.7,156.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,64.0 L600.0,156.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,64.0 L600.0,98.0 Q600.0,110.0 612.0,110.0 L961.3,110.0 Q973.3,110.0 973.3,122.0 L973.3,156.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M226.7,239.0 L226.7,345.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,239.0 L600.0,280.0 Q600.0,292.0 588.0,292.0 L238.7,292.0 Q226.7,292.0 226.7,304.0 L226.7,345.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M385.3,397.0 L441.3,397.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M758.7,397.0 L814.7,397.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M973.3,438.5 L973.3,463.0 Q973.3,475.0 961.3,475.0 L238.7,475.0 Q226.7,475.0 226.7,487.0 L226.7,501.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M385.3,542.5 L441.3,542.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,584.0 L600.0,625.0 Q600.0,637.0 588.0,637.0 L238.7,637.0 Q226.7,637.0 226.7,649.0 L226.7,700.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="351.9" y="622.0" width="122.8" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="413.3" y="641.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">merge to main</text><path d="M385.3,742.0 L441.3,742.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M758.7,742.0 L814.7,742.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="52.0" y="299.0" width="508.3" height="26" rx="13" fill="#F3F8FF"/><text x="63.0" y="318.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#2563EB">2 · BUILD-SCAN (NEEDS QUALITY AND DOCKERFILE-LINT)</text><rect x="52.0" y="644.0" width="580.1" height="26" rx="13" fill="#FFF8F1"/><text x="63.0" y="663.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#EA580C">3 · PUBLISH (MAIN ONLY, NEEDS BUILD-SCAN AND SECRET-SCAN)</text><rect x="52.0" y="110.0" width="227.3" height="26" rx="13" fill="#F2FCFA"/><text x="63.0" y="129.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#0D9488">1 · CHECKS IN PARALLEL</text><rect x="68.0" y="0.0" width="1064.0" height="64.0" rx="32.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(84.0,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="118.0" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">Pull request, push to main or manual run</text><rect x="68.0" y="156.0" width="317.3" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(84.0,170.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="118.0" y="192.0" font-size="21" font-weight="700" fill="#053F3A">quality</text><text x="84.0" y="220.0" font-size="16.5" fill="#334155">ruff lint and 15 unit tests</text><circle cx="70.0" cy="158.0" r="15" fill="#0D9488" stroke="#fff" stroke-width="3"/><text x="70.0" y="164.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><rect x="441.3" y="156.0" width="317.3" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(457.3,170.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="491.3" y="192.0" font-size="21" font-weight="700" fill="#053F3A">dockerfile-lint</text><text x="457.3" y="220.0" font-size="16.5" fill="#334155">hadolint</text><circle cx="443.3" cy="158.0" r="15" fill="#0D9488" stroke="#fff" stroke-width="3"/><text x="443.3" y="164.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><rect x="814.7" y="156.0" width="317.3" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(830.7,170.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="864.7" y="192.0" font-size="21" font-weight="700" fill="#053F3A">secret-scan</text><text x="830.7" y="220.0" font-size="16.5" fill="#334155">gitleaks over the full history</text><circle cx="816.7" cy="158.0" r="15" fill="#0D9488" stroke="#fff" stroke-width="3"/><text x="816.7" y="164.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><rect x="68.0" y="345.0" width="317.3" height="104.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(84.0,359.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="118.0" y="381.0" font-size="21" font-weight="700" fill="#0B2A5B">Build the image</text><text x="84.0" y="409.0" font-size="16.5" fill="#334155">not pushed; APP_VERSION is the</text><text x="84.0" y="430.0" font-size="16.5" fill="#334155">commit SHA</text><circle cx="70.0" cy="347.0" r="15" fill="#2563EB" stroke="#fff" stroke-width="3"/><text x="70.0" y="353.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><rect x="441.3" y="355.5" width="317.3" height="83.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(457.3,369.5) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="491.3" y="391.5" font-size="21" font-weight="700" fill="#0B2A5B">Smoke test</text><text x="457.3" y="419.5" font-size="16.5" fill="#334155">/healthz, then app_info in /metrics</text><rect x="814.7" y="355.5" width="317.3" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(830.7,369.5) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="864.7" y="391.5" font-size="21" font-weight="700" fill="#053F3A">Trivy scan</text><text x="830.7" y="419.5" font-size="16.5" fill="#334155">fails on fixable HIGH or CRITICAL</text><rect x="68.0" y="501.0" width="317.3" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(84.0,515.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="118.0" y="537.0" font-size="21" font-weight="700" fill="#4D2B00">Upload SARIF</text><text x="84.0" y="565.0" font-size="16.5" fill="#334155">to the Security tab</text><rect x="441.3" y="501.0" width="317.3" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(457.3,515.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="491.3" y="537.0" font-size="21" font-weight="700" fill="#4D2B00">SBOM</text><text x="457.3" y="565.0" font-size="16.5" fill="#334155">SPDX JSON, kept as an artifact</text><rect x="68.0" y="700.5" width="317.3" height="83.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(84.0,714.5) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="118.0" y="736.5" font-size="21" font-weight="700" fill="#431407">Push to ghcr.io</text><text x="84.0" y="764.5" font-size="16.5" fill="#334155">tags sha-&lt;commit&gt; and latest</text><circle cx="70.0" cy="702.5" r="15" fill="#EA580C" stroke="#fff" stroke-width="3"/><text x="70.0" y="708.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><rect x="441.3" y="690.0" width="317.3" height="104.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(457.3,704.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="491.3" y="726.0" font-size="21" font-weight="700" fill="#053F3A">cosign sign</text><text x="457.3" y="754.0" font-size="16.5" fill="#334155">by digest, keyless through GitHub</text><text x="457.3" y="775.0" font-size="16.5" fill="#334155">OIDC</text><rect x="814.7" y="700.5" width="317.3" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(830.7,714.5) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="864.7" y="736.5" font-size="21" font-weight="700" fill="#053F3A">Attest provenance</text><text x="830.7" y="764.5" font-size="16.5" fill="#334155">pushed to the registry</text></g><rect x="40" y="1025" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1061" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1089" r="3.6" fill="#94A3B8"/><text x="90" y="1099" font-size="18.5" fill="#1E293B">Every pull request runs three checks at the same time, then builds the image without publishing it, starts it, and scans it.</text><text x="90" y="1125" font-size="18.5" fill="#1E293B">A fixable HIGH or CRITICAL vulnerability stops the run.</text><circle cx="71" cy="1151" r="3.6" fill="#94A3B8"/><text x="90" y="1161" font-size="18.5" fill="#1E293B">Only a merge to main goes on to publish. The image is pushed by digest, signed with cosign without any stored key, and</text><text x="90" y="1187" font-size="18.5" fill="#1E293B">given a provenance record, so each release can be traced to its commit.</text><rect x="40" y="1235" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1251" font-size="15.5" fill="#334155">Trigger</text><rect x="146.8125" y="1235" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="174.8125" y="1251" font-size="15.5" fill="#334155">Check or protection</text><rect x="346.0" y="1235" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="374.0" y="1251" font-size="15.5" fill="#334155">Build and test</text><rect x="499.578125" y="1235" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="527.578125" y="1251" font-size="15.5" fill="#334155">Evidence</text><rect x="620.921875" y="1235" width="20" height="20" rx="6" fill="#FFEEDC" stroke="#EA580C" stroke-width="2"/><text x="648.921875" y="1251" font-size="15.5" fill="#334155">Registry</text><text x="40" y="1285" font-size="14" fill="#94A3B8">Source: .github/workflows/01-secure-cicd.yml</text></svg>
