<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1566" viewBox="0 0 1200 1566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Detect with 04, recover with 02 and 03, write it down</title><desc id="d">Detect with 04, recover with 02 and 03, write it down. drpilot adds recovery and postmortems on top of the monitoring and deployment tooling already in the repo. 1. Project 04&#x27;s Prometheus and Alertmanager detect the failure. Alerts labelled autoremediate are sent to drpilot, and people are still paged. 2. drpilot opens an incident and runs the most specific playbook. 3. The playbook restores the newest snapshot that proves itself (checksum, scratch restore and data checks, in that order), re-applies project 02&#x27;s Terraform for dev, or rolls back project 03&#x27;s Deployment. Recovery counts only after consecutive healthy probes and passing data checks. 4. When every alert has resolved, the postmortem draft is written, optionally as a GitHub issue. A scheduled restore test feeds metrics back to Prometheus, so a backup that stops restoring raises an alert before it is needed.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1564" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="327" height="30" rx="15" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#053F3A">08 · DISASTER RECOVERY AUTOPILOT</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Detect with 04, recover with 02 and 03, write it down</text><text x="40" y="151" font-size="21" fill="#475569">drpilot adds recovery and postmortems on top of the monitoring and deployment tooling already in the repo.</text><g 