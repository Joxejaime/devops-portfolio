<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1249" viewBox="0 0 1200 1249" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Automation tries first, a human is never skipped</title><desc id="d">Automation tries first, a human is never skipped. Every path ends in a postmortem draft, including the ones where automation failed. An alert opens an incident. If a playbook matches, the autopilot runs its steps, verifies the result, and retries up to max_attempts. If none matches, or the last attempt fails, the incident is escalated and a human is paged. An incident closes only when every alert in it has resolved and no recovery is still running, so the postmortem always includes the full automation record. Repeated notifications for a firing alert do not re-run recovery.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1247" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="327" height="30" rx="15" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#053F3A">08 · DISASTER RECOVERY AUTOPILOT</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Automation tries first, a human is never skipped</text><text x="40" y="151" font-size="21" fill="#475569">Every path ends in a postmortem draft, including the ones where automation failed.</text><g transform="translate(0,191.0)"><path d="M600.0,64.0 L600.0,116.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,199.0 L600.0,213.0 Q600.0,225.0 588.0,225.0 L238.7,225.0 Q226.7,225.0 226.7,237.0 L226.7,251.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="330.9" y="210.0" width="165.0" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="413.3" y="229.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">a playbook matches</text><path d="M600.0,199.0 L600.0,218.2 Q600.0,230.2 612.0,230.2 L961.3,230.2 Q973.3,230.2 973.3,242.2 L973.3,261.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="732.7" y="215.2" width="107.9" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="786.7" y="234.2" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">no playbook</text><path d="M226.7,355.0 L226.7,407.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="190.0" y="366.0" width="73.3" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="226.7" y="385.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">verified</text><path d="M368.3,303.0 L831.7,303.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="535.6" y="288.0" width="128.8" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="307.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">out of attempts</text><path d="M226.7,471.0 L226.7,485.0 Q226.7,497.0 238.7,497.0 L588.0,497.0 Q600.0,497.0 600.0,509.0 L600.0,523.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="340.1" y="482.0" width="146.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="413.3" y="501.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">all alerts resolved</text><path d="M973.3,344.5 L973.3,421.8 Q973.3,433.8 961.3,433.8 L612.0,433.8 Q600.0,433.8 600.0,445.8 L600.0,523.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="667.9" y="408.8" width="237.6" height="50" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="786.7" y="427.8" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">a human fixes it and the alerts</text><text x="786.7" y="447.8" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">resolve</text><path d="M600.0,587.0 L600.0,639.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="502.8" y="598.0" width="194.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="617.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">no recovery still running</text><rect x="458.3" y="0.0" width="283.3" height="64.0" rx="32.0" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(474.3,14.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="508.3" y="36.0" font-size="21" font-weight="700" fill="#6B0A20">Alert fires</text><rect x="458.3" y="116.0" width="283.3" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(474.3,130.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="508.3" y="152.0" font-size="21" font-weight="700" fill="#053F3A">Open</text><text x="474.3" y="180.0" font-size="16.5" fill="#334155">detection time recorded</text><rect x="85.0" y="251.0" width="283.3" height="104.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(101.0,265.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></g><text x="135.0" y="287.0" font-size="21" font-weight="700" fill="#053F3A">Recovering</text><text x="101.0" y="315.0" font-size="16.5" fill="#334155">run the steps, then verify; retry</text><text x="101.0" y="336.0" font-size="16.5" fill="#334155">up to max_attempts</text><rect x="831.7" y="261.5" width="283.3" height="83.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(847.7,275.5) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="881.7" y="297.5" font-size="21" font-weight="700" fill="#6B0A20">Escalated</text><text x="847.7" y="325.5" font-size="16.5" fill="#334155">a human is paged</text><rect x="85.0" y="407.0" width="283.3" height="64.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(101.0,421.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="135.0" y="443.0" font-size="21" font-weight="700" fill="#053F3A">Mitigated</text><rect x="458.3" y="523.0" width="283.3" height="64.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(474.3,537.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="508.3" y="559.0" font-size="21" font-weight="700" fill="#06361A">Resolved</text><rect x="458.3" y="639.0" width="283.3" height="83.0" rx="41.5" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(474.3,653.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="508.3" y="675.0" font-size="21" font-weight="700" fill="#06361A">Closed</text><text x="474.3" y="703.0" font-size="16.5" fill="#334155">postmortem draft written</text></g><rect x="40" y="953" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="989" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1017" r="3.6" fill="#94A3B8"/><text x="90" y="1027" font-size="18.5" fill="#1E293B">An alert opens an incident. If a playbook matches, the autopilot runs its steps, verifies the result, and retries up to</text><text x="90" y="1053" font-size="18.5" fill="#1E293B">max_attempts. If none matches, or the last attempt fails, the incident is escalated and a human is paged.</text><circle cx="71" cy="1079" r="3.6" fill="#94A3B8"/><text x="90" y="1089" font-size="18.5" fill="#1E293B">An incident closes only when every alert in it has resolved and no recovery is still running, so the postmortem always</text><text x="90" y="1115" font-size="18.5" fill="#1E293B">includes the full automation record. Repeated notifications for a firing alert do not re-run recovery.</text><rect x="40" y="1163" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="68" y="1179" font-size="15.5" fill="#334155">Alert and escalation</text><rect x="239.359375" y="1163" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="267.359375" y="1179" font-size="15.5" fill="#334155">Automation</text><rect x="377.0" y="1163" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="405.0" y="1179" font-size="15.5" fill="#334155">Recovered and closed</text><text x="40" y="1213" font-size="14" fill="#94A3B8">Source: drpilot/ (incident engine)</text></svg>
