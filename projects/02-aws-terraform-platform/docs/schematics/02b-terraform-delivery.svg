<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1778" viewBox="0 0 1200 1778" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">No stored AWS keys anywhere</title><desc id="d">No stored AWS keys anywhere. Plans use a read-only role; applies need an approved GitHub Environment. GitHub proves who it is with a short-lived token, and AWS hands back temporary credentials. There is no access key saved in the repository or in GitHub secrets. A pull request only gets a read-only role, enough to show a plan. Applying is a separate manual run that waits for a reviewer to approve the GitHub Environment.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1776" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="251" height="30" rx="15" fill="#FFEEDC" stroke="#EA580C" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#431407">02 · AWS WITH TERRAFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">No stored AWS keys anywhere</text><text x="40" y="151" font-size="21" fill="#475569">Plans use a read-only role; applies need an approved GitHub Environment.</text><line x1="152.0" y1="245" x2="152.0" y2="1488" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="376.0" y1="245" x2="376.0" y2="1488" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="600.0" y1="245" x2="600.0" y2="1488" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="824.0" y1="245" x2="824.0" y2="1488" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="1048.0" y1="245" x2="1048.0" y2="1488" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><rect x="52.0" y="187" width="200.0" height="58" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(62.0,204.0) scale(1.000)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="92.0" y="222.0" font-size="17" font-weight="700" fill="#1E1B4B">Developer</text><rect x="276.0" y="187" width="200.0" height="58" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(286.0,204.0) scale(1.000)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="316.0" y="222.0" font-size="17" font-weight="700" fill="#053F3A">GitHub Actions</text><rect x="500.0" y="187" width="200.0" height="58" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(510.0,204.0) scale(1.000)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="540.0" y="222.0" font-size="17" font-weight="700" fill="#431407">AWS STS (OIDC)</text><rect x="724.0" y="187" width="200.0" height="58" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(734.0,204.0) scale(1.000)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="764.0" y="222.0" font-size="17" font-weight="700" fill="#4D2B00">S3 state bucket</text><rect x="948.0" y="187" width="200.0" height="58" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(958.0,204.0) scale(1.000)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="988.0" y="222.0" font-size="17" font-weight="700" fill="#431407">AWS account</text><path d="M156.0,302.0 L374.0,302.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="278.0" y="276.0" text-anchor="middle" font-size="16.5" fill="#1E293B">Open a pull request</text><circle cx="176.0" cy="302.0" r="13" fill="#6366F1" stroke="#fff" stroke-width="2.5"/><text x="176.0" y="307.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">1</text><rect x="392.0" y="324.0" width="366.2" height="60" rx="12" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M376.0,354.0 L392.0,354.0" stroke="#0D9488" stroke-width="2"/><circle cx="414.0" cy="354.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="414.0" y="359.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">2</text><text x="438.0" y="349.0" font-size="16.5" fill="#1E293B">static job: fmt, wiring check, init without</text><text x="438.0" y="370.0" font-size="16.5" fill="#1E293B">backend, validate</text><rect x="392.0" y="402.0" width="426.0" height="40" rx="12" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M376.0,422.0 L392.0,422.0" stroke="#0D9488" stroke-width="2"/><circle cx="414.0" cy="422.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="414.0" y="427.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">3</text><text x="438.0" y="427.5" font-size="16.5" fill="#1E293B">security job: TFLint and Checkov, SARIF upload</text><path d="M380.0,562.0 L598.0,562.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="502.0" y="473.0" text-anchor="middle" font-size="16.5" fill="#1E293B">AssumeRoleWithWebIdentity</text><text x="502.0" y="494.0" text-anchor="middle" font-size="16.5" fill="#1E293B">as the plan role</text><text x="502.0" y="515.0" text-anchor="middle" font-size="16.5" fill="#1E293B">(subject</text><text x="502.0" y="536.0" text-anchor="middle" font-size="16.5" fill="#1E293B">repo:owner/repo:*)</text><circle cx="400.0" cy="562.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="400.0" y="567.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">4</text><path d="M596.0,644.0 L378.0,644.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="474.0" y="597.0" text-anchor="middle" font-size="16.5" fill="#1E293B">short-lived read-only</text><text x="474.0" y="618.0" text-anchor="middle" font-size="16.5" fill="#1E293B">credentials</text><circle cx="576.0" cy="644.0" r="13" fill="#EA580C" stroke="#fff" stroke-width="2.5"/><text x="576.0" y="649.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">5</text><path d="M380.0,705.0 L822.0,705.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="614.0" y="679.0" text-anchor="middle" font-size="16.5" fill="#1E293B">init remote state, lock with use_lockfile</text><circle cx="400.0" cy="705.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="400.0" y="710.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">6</text><path d="M380.0,766.0 L1046.0,766.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="726.0" y="740.0" text-anchor="middle" font-size="16.5" fill="#1E293B">terraform plan (read-only calls)</text><circle cx="400.0" cy="766.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="400.0" y="771.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">7</text><path d="M372.0,848.0 L154.0,848.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="250.0" y="801.0" text-anchor="middle" font-size="16.5" fill="#1E293B">plan summary in the</text><text x="250.0" y="822.0" text-anchor="middle" font-size="16.5" fill="#1E293B">job summary</text><circle cx="352.0" cy="848.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="352.0" y="853.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">8</text><line x1="40" y1="878" x2="1160" y2="878" stroke="#E11D48" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="40" y="866" width="376.2" height="26" rx="13" fill="#FFE8EC" stroke="#E11D48" stroke-width="1.6"/><text x="54" y="884" font-size="15" font-weight="700" fill="#6B0A20">Apply: a manual run on a protected environment</text><path d="M156.0,1016.0 L374.0,1016.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="278.0" y="927.0" text-anchor="middle" font-size="16.5" fill="#1E293B">merge, then run the</text><text x="278.0" y="948.0" text-anchor="middle" font-size="16.5" fill="#1E293B">workflow with</text><text x="278.0" y="969.0" text-anchor="middle" font-size="16.5" fill="#1E293B">apply_env = dev or</text><text x="278.0" y="990.0" text-anchor="middle" font-size="16.5" fill="#1E293B">prod</text><circle cx="176.0" cy="1016.0" r="13" fill="#6366F1" stroke="#fff" stroke-width="2.5"/><text x="176.0" y="1021.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">9</text><rect x="74.0" y="1036.0" width="380.0" height="83" rx="12" fill="#FFF4D6" stroke="#D97706" stroke-width="1.6"/><text x="264.0" y="1062.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#4D2B00">The job targets a GitHub Environment.</text><text x="264.0" y="1083.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#4D2B00">Required reviewers must approve before it</text><text x="264.0" y="1104.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#4D2B00">continues.</text><path d="M380.0,1239.0 L598.0,1239.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="502.0" y="1150.0" text-anchor="middle" font-size="16.5" fill="#1E293B">AssumeRoleWithWebIdentity</text><text x="502.0" y="1171.0" text-anchor="middle" font-size="16.5" fill="#1E293B">as the apply role</text><text x="502.0" y="1192.0" text-anchor="middle" font-size="16.5" fill="#1E293B">(subject</text><text x="502.0" y="1213.0" text-anchor="middle" font-size="16.5" fill="#1E293B">…:environment:*)</text><circle cx="400.0" cy="1239.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="400.0" y="1244.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">10</text><path d="M596.0,1342.0 L378.0,1342.0" stroke="#475569" stroke-width="2.4" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="474.0" y="1274.0" text-anchor="middle" font-size="16.5" fill="#1E293B">short-lived</text><text x="474.0" y="1295.0" text-anchor="middle" font-size="16.5" fill="#1E293B">credentials, no stored</text><text x="474.0" y="1316.0" text-anchor="middle" font-size="16.5" fill="#1E293B">keys</text><circle cx="576.0" cy="1342.0" r="13" fill="#EA580C" stroke="#fff" stroke-width="2.5"/><text x="576.0" y="1347.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">11</text><path d="M380.0,1403.0 L1046.0,1403.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="726.0" y="1377.0" text-anchor="middle" font-size="16.5" fill="#1E293B">terraform apply (state locked in S3)</text><circle cx="400.0" cy="1403.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="400.0" y="1408.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">12</text><path d="M380.0,1464.0 L822.0,1464.0" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="614.0" y="1438.0" text-anchor="middle" font-size="16.5" fill="#1E293B">write the new state version</text><circle cx="400.0" cy="1464.0" r="13" fill="#0D9488" stroke="#fff" stroke-width="2.5"/><text x="400.0" y="1469.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">13</text><rect x="40" y="1518" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1554" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1582" r="3.6" fill="#94A3B8"/><text x="90" y="1592" font-size="18.5" fill="#1E293B">GitHub proves who it is with a short-lived token, and AWS hands back temporary credentials. There is no access key</text><text x="90" y="1618" font-size="18.5" fill="#1E293B">saved in the repository or in GitHub secrets.</text><circle cx="71" cy="1644" r="3.6" fill="#94A3B8"/><text x="90" y="1654" font-size="18.5" fill="#1E293B">A pull request only gets a read-only role, enough to show a plan. Applying is a separate manual run that waits for a</text><text x="90" y="1680" font-size="18.5" fill="#1E293B">reviewer to approve the GitHub Environment.</text><text x="40" y="1742" font-size="14" fill="#94A3B8">Source: .github/workflows/02-terraform.yml and bootstrap/github-oidc.tf</text></svg>
