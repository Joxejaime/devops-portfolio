4.0" y="912.5" font-size="16.5" fill="#334155">image pulls, AWS APIs</text><rect x="68.0" y="848.5" width="224.0" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(84.0,862.5) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="118.0" y="884.5" font-size="21" font-weight="700" fill="#053F3A">Auto Scaling</text><text x="84.0" y="912.5" font-size="16.5" fill="#334155">target 60 percent CPU</text><rect x="348.0" y="817.0" width="224.0" height="146.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(364.0,831.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="398.0" y="853.0" font-size="21" font-weight="700" fill="#053F3A">IAM roles</text><text x="364.0" y="881.0" font-size="16.5" fill="#334155">execution role pulls the</text><text x="364.0" y="902.0" font-size="16.5" fill="#334155">image and writes logs;</text><text x="364.0" y="923.0" font-size="16.5" fill="#334155">the task role starts with</text><text x="364.0" y="944.0" font-size="16.5" fill="#334155">no permissions</text></g><rect x="40" y="1194" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1230" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1258" r="3.6" fill="#94A3B8"/><text x="90" y="1268" font-size="18.5" fill="#1E293B">Traffic enters through the load balancer only. The containers run in private subnets with no public addresses, and they</text><text x="90" y="1294" font-size="18.5" fill="#1E293B">can reach the outside only over HTTPS through a NAT gateway.</text><circle cx="71" cy="1320" r="3.6" fi