<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1490" viewBox="0 0 1200 1490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Private tasks behind a locked-down load balancer</title><desc id="d">Private tasks behind a locked-down load balancer. Only the ALB is public; tasks have no public IPs and only HTTPS egress. Traffic enters through the load balancer only. The containers run in private subnets with no public addresses, and they can reach the outside only over HTTPS through a NAT gateway. dev uses two availability zones and one shared NAT gateway to keep cost down. prod uses three zones, a NAT gateway per zone, HTTPS only and deletion protection.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1488" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="251" height="30" rx="15" fill="#FFEEDC" stroke="#EA580C" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#431407">02 · AWS WITH TERRAFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Private tasks behind a locked-down load balancer</text><text x="40" y="151" font-size="21" fill="#475569">Only the ALB is public; tasks have no public IPs and only HTTPS egress.</text><g transform="translate(0,191.0)"><rect x="318.0" y="155.0" width="844.0" height="612.0" rx="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><rect x="324.0" y="207.0" width="552.0" height="250.0" rx="20" fill="#FFF8F1" stroke="#EA580C" stroke-width="1.6"/><rect x="324.0" y="511.0" width="272.0" height="250.0" rx="20" fill="#F3F8FF" stroke="#2563EB" stroke-width="1.6"/><path d="M460.0,73.5 L460.0,261.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M460.0,433.0 L460.0,565.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="363.1" y="484.0" width="193.9" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="460.0" y="503.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">ALB security group only</text><path d="M572.0,651.0 L728.0,651.0 Q740.0,651.0 740.0,639.0 L740.0,399.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="670.7" y="510.0" width="138.7" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="740.0" y="529.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">HTTPS 443 only</text><path d="M852.0,347.0 L908.0,347.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M1020.0,388.0 L1020.0,848.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M348.0,347.0 L292.0,347.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M180.0,282.0 L180.0,83.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M348.0,616.6 L332.0,616.6 Q320.0,616.6 320.0,628.6 L320.0,639.0 Q320.0,651.0 308.0,651.0 L292.0,651.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M292.0,890.0 L308.0,890.0 Q320.0,890.0 320.0,878.0 L320.0,706.0 Q320.0,694.0 332.0,694.0 L348.0,694.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="260.8" y="777.0" width="118.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="320.0" y="796.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">desired count</text><path d="M460.0,817.0 L460.0,737.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="326.0" y="163.0" width="305.4" height="26" rx="13" fill="#F8FAFC"/><text x="337.0" y="182.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#64748B">VPC, 2 TO 3 AVAILABILITY ZONES</text><rect x="332.0" y="215.0" width="167.7" height="26" rx="13" fill="#FFF8F1"/><text x="343.0" y="234.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#EA580C">PUBLIC SUBNETS</text><rect x="332.0" y="519.0" width="311.1" height="26" rx="13" fill="#F3F8FF"/><text x="343.0" y="538.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#2563EB">PRIVATE SUBNETS, NO PUBLIC IPS</text><rect x="68.0" y="0.0" width="224.0" height="83.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(84.0,14.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="118.0" y="36.0" font-size="21" font-weight="700" fill="#6B0A20">SNS topic</text><text x="84.0" y="64.0" font-size="16.5" fill="#334155">email subscription</text><rect x="348.0" y="9.5" width="224.0" height="64.0" rx="32.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(364.0,23.5) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="398.0" y="45.5" font-size="21" font-weight="700" fill="#1E1B4B">Users</text><rect x="68.0" y="282.0" width="224.0" height="130.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(84.0,296.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="118.0" y="318.0" font-size="21" font-weight="700" fill="#6B0A20">CloudWatch</text><text x="118.0" y="344.0" font-size="21" font-weight="700" fill="#6B0A20">alarms</text><text x="84.0" y="372.0" font-size="16.5" fill="#334155">5xx responses,</text><text x="84.0" y="393.0" font-size="16.5" fill="#334155">unhealthy hosts</text><rect x="348.0" y="261.0" width="224.0" height="172.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(364.0,275.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="398.0" y="297.0" font-size="21" font-weight="700" fill="#431407">Application</text><text x="398.0" y="323.0" font-size="21" font-weight="700" fill="#431407">Load Balancer</text><text x="364.0" y="351.0" font-size="16.5" fill="#334155">drops invalid headers,</text><text x="364.0" y="372.0" font-size="16.5" fill="#334155">TLS 1.3 policy; HTTP</text><text x="364.0" y="393.0" font-size="16.5" fill="#334155">redirects to HTTPS in</text><text x="364.0" y="414.0" font-size="16.5" fill="#334155">prod</text><rect x="628.0" y="295.0" width="224.0" height="104.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(644.0,309.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="678.0" y="331.0" font-size="21" font-weight="700" fill="#431407">NAT gateway</text><text x="644.0" y="359.0" font-size="16.5" fill="#334155">1 shared in dev, 1 per AZ</text><text x="644.0" y="380.0" font-size="16.5" fill="#334155">in prod</text><rect x="908.0" y="306.0" width="224.0" height="82.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(924.0,320.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="958.0" y="342.0" font-size="21" font-weight="700" fill="#431407">Internet</text><text x="958.0" y="368.0" fon