<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Stale alert rules fail the build</title><desc id="d">Stale alert rules fail the build. CI regenerates the rules from the SLO file and runs Prometheus&#x27; own checker. On every push or pull request that touches this project, two jobs run side by side. The verify job runs the same checks as make lint, check and test, including live chaos experiments. It also regenerates the alert rules from the SLO file and fails if the committed rules differ. The prometheus-rules job runs promtool, which is Prometheus&#x27; own authoritative syntax check.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="882" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="232" height="30" rx="15" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#053F3A">07 · SRE RELIABILITY LAB</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Stale alert rules fail the build</text><text x="40" y="151" font-size="21" fill="#475569">CI regenerates the rules from the SLO file and runs Prometheus&#x27; own checker.</text><g transform="translate(0,191.0)"><path d="M600.0,64.0 L600.0,78.0 Q600.0,90.0 588.0,90.0 L332.0,90.0 Q320.0,90.0 320.0,102.0 L320.0,116.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,64.0 L600.0,88.5 Q600.0,100.5 612.0,100.5 L868.0,100.5 Q880.0,100.5 880.0,112.5 L880.0,137.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M320.0,241.0 L320.0,255.0 Q320.0,267.0 332.0,267.0 L588.0,267.0 Q600.0,267.0 600.0,279.0 L600.0,293.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M880.0,220.0 L880.0,244.5 Q880.0,256.5 868.0,256.5 L612.0,256.5 Q600.0,256.5 600.0,268.5 L600.0,293.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="68.0" y="0.0" width="1064.0" height="64.0" rx="32.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(84.0,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="118.0" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">Push or pull request touching this project</text><rect x="68.0" y="116.0" width="504.0" height="125.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(84.0,130.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="118.0" y="152.0" font-size="21" font-weight="700" fill="#0B2A5B">Job: verify</text><text x="84.0" y="180.0" font-size="16.5" fill="#334155">ruff lint and format; SLO definitions valid; generated rules</text><text x="84.0" y="201.0" font-size="16.5" fill="#334155">not stale; config checks and compose file; tests including</text><text x="84.0" y="222.0" font-size="16.5" fill="#334155">live chaos experiments</text><rect x="628.0" y="137.0" width="504.0" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(644.0,151.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="678.0" y="173.0" font-size="21" font-weight="700" fill="#053F3A">Job: prometheus-rules</text><text x="644.0" y="201.0" font-size="16.5" fill="#334155">promtool check rules; promtool check config (advisory)</text><rect x="68.0" y="293.0" width="1064.0" height="64.0" rx="32.0" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(84.0,307.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="118.0" y="329.0" font-size="21" font-weight="700" fill="#06361A">Checks complete</text></g><rect x="40" y="588" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="624" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="652" r="3.6" fill="#94A3B8"/><text x="90" y="662" font-size="18.5" fill="#1E293B">On every push or pull request that touches this project, two jobs run side by side. The verify job runs the same checks</text><text x="90" y="688" font-size="18.5" fill="#1E293B">as make lint, check and test, including live chaos experiments.</text><circle cx="71" cy="714" r="3.6" fill="#94A3B8"/><text x="90" y="724" font-size="18.5" fill="#1E293B">It also regenerates the alert rules from the SLO file and fails if the committed rules differ. The prometheus-rules job runs</text><text x="90" y="750" font-size="18.5" fill="#1E293B">promtool, which is Prometheus&#x27; own authoritative syntax check.</text><rect x="40" y="798" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="814" font-size="15.5" fill="#334155">Trigger</text><rect x="146.8125" y="798" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="174.8125" y="814" font-size="15.5" fill="#334155">Verify job</text><rect x="270.921875" y="798" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="298.921875" y="814" font-size="15.5" fill="#334155">Prometheus job</text><rect x="439.84375" y="798" width