<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1364" viewBox="0 0 1200 1364" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Pages wake someone. Tickets can wait.</title><desc id="d">Pages wake someone. Tickets can wait.. Alertmanager routing, runbooks, postmortems and the action items that feed back into alerts. Alertmanager groups alerts by service and SLO, then sorts them by severity. A page goes to the pager receiver and repeats every hour. Anything else goes to the ticket receiver every 4 hours. While a page is firing for an SLO, its ticket-level alerts are held back so the on-call engineer is not told twice. The receiver URLs are placeholders for PagerDuty, Opsgenie or Slack, and the postmortems folder holds only a template because no real incident has happened.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1362" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="232" height="30" rx="15" fill="#FFE8EC" stroke="#E11D48" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#6B0A20">07 · SRE RELIABILITY LAB</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Pages wake someone. Tickets can wait.</text><text x="40" y="151" font-size="21" fill="#475569">Alertmanager routing, runbooks, postmortems and the action items that feed back into alerts.</text><g transform="translate(0,191.0)"><path d="M600.0,109.0 L600.0,161.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,243.0 L600.0,295.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,359.0 L600.0,373.0 Q600.0,385.0 588.0,385.0 L238.7,385.0 Q226.7,385.0 226.7,397.0 L226.7,411.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="385.9" y="370.0" width="54.9" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="413.3" y="389.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">page</text><path d="M600.0,359.0 L600.0,373.0 Q600.0,385.0 612.0,385.0 L961.3,385.0 Q973.3,385.0 973.3,397.0 L973.3,411.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="757.7" y="370.0" width="58.0" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="786.7" y="389.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">ticket</text><path d="M368.3,452.5 L831.7,452.5" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="490.6" y="427.5" width="218.8" height="50" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="446.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">inhibits tickets for the same</text><text x="600.0" y="466.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">SLO</text><path d="M226.7,494.0 L226.7,546.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M226.7,650.0 L226.7,702.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M85.0,756.5 L40.0,756.5 Q28.0,756.5 28.0,744.5 L28.0,66.5 Q28.0,54.5 40.0,54.5 L458.3,54.5" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="458.3" y="0.0" width="283.3" height="109.0" rx="54.5" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(474.3,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="508.3" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">Alert from</text><text x="508.3" y="62.0" font-size="21" font-weight="700" fill="#1E1B4B">Prometheus</text><text x="474.3" y="90.0" font-size="16.5" fill="#334155">labels: service, slo, severity</text><rect x="458.3" y="161.0" width="283.3" height="82.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(474.3,175.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="508.3" y="197.0" font-size="21" font-weight="700" fill="#053F3A">Alertmanager groups</text><text x="508.3" y="223.0" font-size="21" font-weight="700" fill="#053F3A">by service and SLO</text><polygon points="480.3,295.0 719.7,295.0 741.7,327.0 719.7,359.0 480.3,359.0 458.3,327.0" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(492.3,309.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="526.3" y="331.0" font-size="21" font-weight="700" fill="#053F3A">Severity?</text><rect x="85.0" y="411.0" width="283.3" height="83.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(101.0,425.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="135.0" y="447.0" font-size="21" font-weight="700" fill="#6B0A20">Pager receiver</text><text x="101.0" y="475.0" font-size="16.5" fill="#334155">repeats every hour</text><rect x="831.7" y="411.0" width="283.3" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(847.7,425.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="881.7" y="447.0" font-size="21" font-weight="700" fill="#4D2B00">Ticket receiver</text><text x="847.7" y="475.0" font-size="16.5" fill="#334155">repeats every 4 hours</text><rect x="85.0" y="546.0" width="283.3" height="104.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(101.0,560.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="135.0" y="582.0" font-size="21" font-weight="700" fill="#0B2A5B">On-call engineer</text><text x="101.0" y="610.0" font-size="16.5" fill="#334155">follows the runbook linked in</text><text x="101.0" y="631.0" font-size="16.5" fill="#334155">the alert and mitigates</text><rect x="85.0" y="702.0" width="283.3" height="109.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(101.0,716.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></g><text x="135.0" y="738.0" font-size="21" font-weight="700" fill="#06361A">Postmortem and</text><text x="135.0" y="764.0" font-size="21" font-weight="700" fill="#06361A">action items</text><text x="101.0" y="792.0" font-size="16.5" fill="#334155">new SLO, alert or runbook</text></g><rect x="40" y="1042" width="1120" height="214" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1078" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1106" r="3.6" fill="#94A3B8"/><text x="90" y="1116" font-size="18.5" fill="#1E293B">Alertmanager groups alerts by service and SLO, then sorts them by severity. A page goes to the pager receiver and</text><text x="90" y="1142" font-size="18.5" fill="#1E293B">repeats every hour. Anything else goes to the ticket receiver every 4 hours.</text><circle cx="71" cy="1168" r="3.6" fill="#94A3B8"/><text x="90" y="1178" font-size="18.5" fill="#1E293B">While a page is firing for an SLO, its ticket-level alerts are held back so the on-call engineer is not told twice. The</text><text x="90" y="1204" font-size="18.5" fill="#1E293B">receiver URLs are placeholders for PagerDuty, Opsgenie or Slack, and the postmortems folder holds only a template</text><text x="90" y="1230" font-size="18.5" fill="#1E293B">because no real incident has happened.</text><rect x="40" y="1278" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1294" font-size="15.5" fill="#334155">Alert</text><rect x="128.625" y="1278" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="156.625" y="1294" font-size="15.5" fill="#334155">Routing</text><rect x="238.3125" y="1278" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="266.3125" y="1294" font-size="15.5" fill="#334155">Page</text><rect x="329.453125" y="1278" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="357.453125" y="1294" font-size="15.5" fill="#334155">Ticket</text><rect x="428.328125" y="1278" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="456.328125" y="1294" font-size="15.5" fill="#334155">Human response</text><rect x="606.765625" y="1278" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="634.765625" y="1294" font-size="15.5" fill="#334155">Learning</text><text x="40" y="1328" font-size="14" fill="#94A3B8">Source: observability/alertmanager.yml and docs/</text></svg>
