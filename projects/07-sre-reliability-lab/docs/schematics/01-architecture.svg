etheus rules, so the alerts</text><text x="90" y="968" font-size="18.5" fill="#1E293B">cannot drift from the targets.</text><circle cx="71" cy="994" r="3.6" fill="#94A3B8"/><text x="90" y="1004" font-size="18.5" fill="#1E293B">A demo service gives the alerts something real to measure. The chaos runner injects faults into it, sends test traffic, and</text><text x="90" y="1030" font-size="18.5" fill="#1E293B">reads the result from the client side and from the service&#x27;s own /metrics. The compose stack (make up) runs the</text><text x="90" y="1056" font-size="18.5" fill="#1E293B">service, load generator, Prometheus, Alertmanager and Grafana.</text><rect x="40" y="1104" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="68" y="1120" font-size="15.5" fill="#334155">SLO source</text><rect x="178.609375" y="1104" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="206.609375" y="1120" font-size="15.5" fill="#334155">Generator and rules</text><rect x="378.0" y="1104" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="406.0" y="1120" font-size="15.5" fill="#334155">Service</text><rect x="487.40625" y="1104" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="515.40625" y="1120" font-size="15.5" fill="#334155">Fault injection</text><rect x="643.3125" y="1104" width="20" height="20" rx="6" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2"/><text x="671.3125" y="1120" font-size="15.5" fill="#334155">Observability</text><rect x="794.125" y="1104" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="822.125" y="1120" font-size="15.5" fill="#334155">Report</text><text x="40" y="1154" font-size="14" fill="#94A3B8">Source: slogen/, chaos/, docker-compose.yml</text></svg>
