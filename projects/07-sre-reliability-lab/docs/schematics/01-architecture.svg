<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Reliability as code, tested with real failures</title><desc id="d">Reliability as code, tested with real failures. One SLO file drives the alerts. A chaos runner breaks the demo service and checks what happened. The three SLOs are written once in a single file. A generator turns that file into the Prometheus rules, so the alerts cannot drift from the targets. A demo service gives the alerts something real to measure. The chaos runner injects faults into it, sends test traffic, and reads the result from the client side and from the service&#x27;s own /metrics. The compose stack (make up) runs the service, load generator, Prometheus, Alertmanager and Grafana.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1188" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="232" height="30" rx="15" fill="#FFF4D6" stroke="#D97706" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#4D2B00">07 · SRE RELIABILITY LAB</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Reliability as code, tested with real failures</text><text x="40" y="151" font-size="21" fill="#475569">One SLO file drives the alerts. A chaos runner breaks the demo service and checks what happened.</text><g transform="translate(0,191.0)"><rect x="604.0" y="372.5" width="552.0" height="288.5" rx="20" fill="#F8F5FF" stroke="#7C3AED" stroke-width="1.6"/><rect x="44.0" y="146.0" width="272.0" height="515.0" rx="20" fill="#F3F8FF" stroke="#2563EB" stroke-width="1.6"/><path d="M292.0,54.0 L348.0,54.0" fill="none" stroke="#475569" stroke-