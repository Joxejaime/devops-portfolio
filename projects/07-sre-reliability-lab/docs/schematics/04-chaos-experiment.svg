ill not inject a fault unless the system is healthy first. It checks the abort condition every second, always</text><text x="90" y="1294" font-size="18.5" fill="#1E293B">clears the fault afterwards, and stops its traffic threads in a finally block.</text><circle cx="71" cy="1320" r="3.6" fill="#94A3B8"/><text x="90" y="1330" font-size="18.5" fill="#1E293B">It gives a verdict only after four checks: clients saw the fault, the service&#x27;s own metrics saw it, a control route stayed</text><text x="90" y="1356" font-size="18.5" fill="#1E293B">healthy, and the service recovered in time. Exit codes: 0 held, 1 failed, 2 aborted, 3 precondition failed.</text><rect x="40" y="1404" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1420" font-size="15.5" fill="#334155">Scenario</text><rect x="158.8125" y="1404" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="186.8125" y="1420" font-size="15.5" fill="#334155">Action</text><rect x="259.640625" y="1404" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="287.640625" y="1420" font-size="15.5" fill="#334155">Check</text><rect x="360.53125" y="1404" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="388.53125" y="1420" font-size="15.5" fill="#334155">Hypothesis held</text><rect x="532.828125" y="1404" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="560.828125" y="1420" font-size="15.5" fill="#334155">Stopped early</text><rect x="689.34375" y="1404" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="717.34375" y="1420" font-size="15.5" fill="#334155">Failed</text><text x="40" y="1454" font-size="14" fill="#94A3B8">Source: chaos/runner.py</text></svg>
