y fails</text><path d="M600.0,625.0 L600.0,677.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="458.3" y="0.0" width="283.3" height="64.0" rx="32.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(474.3,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="508.3" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">Scenario file</text><polygon points="480.3,116.5 719.7,116.5 741.7,157.5 719.7,198.5 480.3,198.5 458.3,157.5" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(492.3,130.5) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="526.3" y="152.5" font-size="21" font-weight="700" fill="#053F3A">Steady state</text><text x="526.3" y="178.5" font-size="21" font-weight="700" fill="#053F3A">holds?</text><rect x="831.7" y="116.0" width="283.3" height="83.0" rx="41.5" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(847.7,130.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="881.7" y="152.0" font-size="21" font-weight="700" fill="#6B0A20">Precondition failed</text><text x="847.7" y="180.0" font-size="16.5" fill="#334155">exit 3, nothing injected</text><rect x="458.3" y="251.0" width="283.3" height="83.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(474.3,265.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12