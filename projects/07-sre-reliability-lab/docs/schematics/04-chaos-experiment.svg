<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1490" viewBox="0 0 1200 1490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">A chaos experiment that checks its own claims</title><desc id="d">A chaos experiment that checks its own claims. It refuses to start unless healthy, aborts on damage and checks that a control route stayed clean. The runner will not inject a fault unless the system is healthy first. It checks the abort condition every second, always clears the fault afterwards, and stops its traffic threads in a finally block. It gives a verdict only after four checks: clients saw the fault, the service&#x27;s own metrics saw it, a control route stayed healthy, and the service recovered in time. Exit codes: 0 held, 1 failed, 2 aborted, 3 precondition failed.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1488" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="232" height="30" rx="15" fill="#FFE8EC" stroke="#E11D48" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#6B0A20">07 · SRE RELIABILITY LAB</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">A chaos experiment that checks its own claims</text><text x="40" y="151" font-size="21" fill="#475569">It refuses to start unless healthy, aborts on damage and checks that a control route stayed clean.</text><g transform="translate(0,191.0)"><path d="M600.0,64.0 L600.0,116.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M741.7,157.5 L831.7,157.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="768.4" y="142.5" width="36.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width=