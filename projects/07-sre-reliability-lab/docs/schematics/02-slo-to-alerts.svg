 0 4 0"/></g><text x="398.0" y="332.0" font-size="21" font-weight="700" fill="#6B0A20">ModerateBurn</text><text x="364.0" y="360.0" font-size="16.5" fill="#334155">6h and 30m above 6x</text><circle cx="350.0" cy="298.0" r="15" fill="#E11D48" stroke="#fff" stroke-width="3"/><text x="350.0" y="304.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">P</text><rect x="628.0" y="296.0" width="224.0" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(644.0,310.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="678.0" y="332.0" font-size="21" font-weight="700" fill="#4D2B00">SlowBurn</text><text x="644.0" y="360.0" font-size="16.5" fill="#334155">1d and 2h above 3x</text><circle cx="630.0" cy="298.0" r="15" fill="#D97706" stroke="#fff" stroke-width="3"/><text x="630.0" y="304.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">T</text><rect x="908.0" y="296.0" width="224.0" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(924.0,310.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="958.0" y="332.0" font-size="21" font-weight="700" fill="#4D2B00">Drift</text><text x="924.0" y="360.0" font-size="16.5" fill="#334155">3d and 6h above 1x</text><circle cx="910.0" cy="298.0" r="15" fill="#D97706" stroke="#fff" stroke-width="3"/><text x="910.0" y="304.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">T</text><rect x="348.0" y="431.0" width="504.0" height="83.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(364.0,445.0) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="398.0" y="467.0" font-size="21" font-weight="700" fill="#2E1065">Alertmanager</text><text x="364.0" y="495.0" font-size="16.5" fill="#334155">P = page, T = ticket</text></g><rect x="40" y="745" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="781" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="809" r="3.6" fill="#94A3B8"/><text x="90" y="819" font-size="18.5" fill="#1E293B">An SLO is stated once. The recording rules and the four burn-rate alerts are generated from it, never written by hand.</text><circle cx="71" cy="845" r="3.6" fill="#94A3B8"/><text x="90" y="855" font-size="18.5" fill="#1E293B">Each alert needs both of its windows above the threshold. The long window shows the burn is significant, the short one</text><text x="90" y="881" font-size="18.5" fill="#1E293B">shows it is still happening, so the alert clears quickly after a fix. CI runs generate --check, and slogen simulate replays</text><text x="90" y="907" font-size="18.5" fill="#1E293B">an incident through the same four policies.</text><rect x="40" y="955" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="971" font-size="15.5" fill="#334155">SLO definition</text><rect x="196.671875" y="955" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="224.671875" y="971" font-size="15.5" fill="#334155">Generated rules</text><rect x="367.75" y="955" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="395.75" y="971" font-size="15.5" fill="#334155">Page</text><rect x="458.890625" y="955" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="486.890625" y="971" font-size="15.5" fill="#334155">Ticket</text><rect x="557.765625" y="955" width="20" height="20" rx="6" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2"/><text x="585.765625" y="971" font-size="15.5" fill="#334155">Alertmanager</text><rect x="710.890625" y="955" width="20" height="20" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="738.890625" y="971" font-size="15.5" fill="#334155">CI check</text><text x="40" y="1005" font-size="14" fill="#94A3B8">Source: slogen/rules.py and slogen/policies.py</text></svg>
