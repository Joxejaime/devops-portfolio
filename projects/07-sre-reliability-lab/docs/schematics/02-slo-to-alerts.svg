<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1041" viewBox="0 0 1200 1041" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">One SLO file generates every alert</title><desc id="d">One SLO file generates every alert. Four burn-rate alerts: two page someone, two open tickets. An SLO is stated once. The recording rules and the four burn-rate alerts are generated from it, never written by hand. Each alert needs both of its windows above the threshold. The long window shows the burn is significant, the short one shows it is still happening, so the alert clears quickly after a fix. CI runs generate --check, and slogen simulate replays an incident through the same four policies.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1039" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="232" height="30" rx="15" fill="#FFE8EC" stroke="#E11D48" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#6B0A20">07 · SRE RELIABILITY LAB</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">One SLO file generates every alert</text><text x="40" y="151" font-size="21" fill="#475569">Four burn-rate alerts: two page someone, two open tickets.</text><g transform="translate(0,191.0)"><path d="M600.0,83.0 L600.0,148.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,231.0 L600.0,251.5 Q600.0,263.5 588.0,263.5 L192.0,263.5 Q180.0,263.5 180.0,275.5 L180.0,296.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M180.0,379.0 L180.0,393.0 Q180.0,405.0 192.0,405.0 L588.0,405.0 Q600.0,405.0 600.0,417.0 L600.0,431.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,231.0 L600.0,251.5 Q600.0,263.5 588.0,263.5 L472.0,263.5 Q460.0,263.5 460.0,275.5 L460.0,296.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M460.0,379.0 L460.0,393.0 Q460.0,405.0 472.0,405.0 L588.0,405.0 Q600.0,405.0 600.0,417.0 L600.0,431.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,231.0 L600.0,251.5 Q600.0,263.5 612.0,263.5 L728.0,263.5 Q740.0,263.5 740.0,275.5 L740.0,296.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M740.0,379.0 L740.0,393.0 Q740.0,405.0 728.0,405.0 L612.0,405.0 Q600.0,405.0 600.0,417.0 L600.0,431.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,231.0 L600.0,251.5 Q600.0,263.5 612.0,263.5 L1008.0,263.5 Q1020.0,263.5 1020.0,275.5 L1020.0,296.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M1020.0,379.0 L1020.0,393.0 Q1020.0,405.0 1008.0,405.0 L612.0,405.0 Q600.0,405.0 600.0,417.0 L600.0,431.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M908.0,189.5 L852.0,189.5" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="348.0" y="0.0" width="504.0" height="83.0" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(364.0,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="398.0" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">SLO definition</text><text x="364.0" y="64.0" font-size="16.5" fill="#334155">objective, 30 day window, availability or latency SLI</text><rect x="348.0" y="148.0" width="504.0" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(364.0,162.0) scale(1.083)" fill="none" stroke="#0D9488" st