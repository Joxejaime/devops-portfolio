="681.3" y="894.0" font-size="16.5" fill="#334155">the build passes</text></g><rect x="40" y="1144" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1180" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1208" r="3.6" fill="#94A3B8"/><text x="90" y="1218" font-size="18.5" fill="#1E293B">validate reads service.yaml first, because its tier sets what the other files must look like. Then it checks the Kubernetes</text><text x="90" y="1244" font-size="18.5" fill="#1E293B">manifests, the Dockerfile and the CI workflows.</text><circle cx="71" cy="1270" r="3.6" fill="#94A3B8"/><text x="90" y="1280" font-size="18.5" fill="#1E293B">Every finding has a stable ID such as K8S009, so a failure says exactly which guardrail it hit. Errors exit with code 1;</text><text x="90" y="1306" font-size="18.5" fill="#1E293B">warnings fail only with --strict. Policy defaults can be overridden with --policy, and unknown keys are rejected.</text><rect x="40" y="1354" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1370" font-size="15.5" fill="#334155">Command</text><rect x="169.125" y="1354" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="197.125" y="1370" font-size="15.5" fill="#334155">Rules</text><rect x="263.234375" y="1354" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="291.234375" y="1370" font-size="15.5" fill="#334155">Policy config and findings</text><rect x="506.578125" y="1354" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="534.578125" y="1370" font-size="15.5" fill="#334155">Fails</text><rect x="593.75" y="1354" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="621.75" y="1370" font-size="15.5" fill="#334155">Passes</text><text x="40" y="1404" font-size="14" fill