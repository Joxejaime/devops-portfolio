<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Guardrails as code, each rule with a stable ID</title><desc id="d">Guardrails as code, each rule with a stable ID. Spec, Kubernetes, Dockerfile and CI rules run on any repo. Errors fail the build. validate reads service.yaml first, because its tier sets what the other files must look like. Then it checks the Kubernetes manifests, the Dockerfile and the CI workflows. Every finding has a stable ID such as K8S009, so a failure says exactly which guardrail it hit. Errors exit with code 1; warnings fail only with --strict. Policy defaults can be overridden with --policy, and unknown keys are rejected.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1438" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="249" height="30" rx="15" fill="#E3F8F3" stroke="#0D9488" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#053F3A">06 · DEVELOPER PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Guardrails as code, each rule with a stable ID</text><text x="40" y="151" font-size="21" fill="#475569">Spec, Kubernetes, Dockerfile and CI rules run on any repo. Errors fail the build.</text><g transform="translate(0,191.0)"><path d="M600.0,82.0 L600.0,134.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,264.0 L600.0,278.0 Q600.0,290.0 588.0,290.0 L238.7,290.0 Q226.7,290.0 226.7,302.0 L226.7,316.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,264.0 L600.0,347.5" fill="none" stroke="#475569" stroke-width="2.4" ma