t-weight="700" fill="#053F3A">K8S001-K8S011</text><text x="84.0" y="406.0" font-size="16.5" fill="#334155">pinned image tag, allowed registry,</text><text x="84.0" y="427.0" font-size="16.5" fill="#334155">resource limits, non-root, no</text><text x="84.0" y="448.0" font-size="16.5" fill="#334155">privilege escalation, probes,</text><text x="84.0" y="469.0" font-size="16.5" fill="#334155">replicas at least the tier minimum,</text><text x="84.0" y="490.0" font-size="16.5" fill="#334155">labels</text><rect x="441.3" y="347.5" width="317.3" height="130.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(457.3,361.5) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="491.3" y="383.5" font-size="21" font-weight="700" fill="#053F3A">Dockerfile ·</text><text x="491.3" y="409.5" font-size="21" font-weight="700" fill="#053F3A">DOCK001-DOCK003</text><text x="457.3" y="437.5" font-size="16.5" fill="#334155">non-root USER, pinned base image,</text><text x="457.3" y="458.5" font-size="16.5" fill="#334155">HEALTHCHECK</text><rect x="814.7" y="347.5" width="317.3" height="130.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(830.7,361.5) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="864.7" y="383.5" font-size="21" font-weight="700" fill="#053F3A">CI workflows ·</text><text x="864.7" y="409.5" font-size="21" font-weight="700" fill="#053F3A">CI001-CI002</text><text x="830.7" y="437.5" font-size="16.5" fill="#334155">permissions block, pinned action</text><text x="830.7" y="458.5" font-size="16.5" fill="#334155">versions</text><rect x="441.3" y="561.0" width="317.3" height="83.0" rx="14" fill="#FFF