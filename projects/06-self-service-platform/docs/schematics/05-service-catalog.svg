<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1128" viewBox="0 0 1200 1128" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">A service catalog that validates as it lists</title><desc id="d">A service catalog that validates as it lists. Scan every service.yaml, validate each one, and publish markdown or JSON. Errors fail CI. The catalog is built by scanning a folder of service.yaml files and running the same validation on each one, so a listing and a compliance check come from the same pass. Two services with the same name raise CAT001. The command exits 1 if any service has an error, so it can gate CI.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1126" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="249" height="30" rx="15" fill="#FFF4D6" stroke="#D97706" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#4D2B00">06 · DEVELOPER PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">A service catalog that validates as it lists</text><text x="40" y="151" font-size="21" fill="#475569">Scan every service.yaml, validate each one, and publish markdown or JSON. Errors fail CI.</text><g transform="translate(0,191.0)"><path d="M600.0,83.0 L600.0,135.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,199.0 L600.0,251.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,355.0 L600.0,369.0 Q600.0,381.0 588.0,381.0 L238.7,381.0 Q226.7,381.0 226.7,393.0 L226.7,407.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,355.0 L600.0,427.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,355.0 L600.0,379.0 Q600.0,391.0 612.0,391.0 L961.3,391.0 Q973.3,391.0 973.3,403.0 L973.3,427.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M973.3,491.0 L973.3,515.0 Q973.3,527.0 961.3,527.0 L836.0,527.0 Q824.0,527.0 824.0,539.0 L824.0,563.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="876.8" y="512.0" width="43.6" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="898.7" y="531.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">yes</text><path d="M973.3,491.0 L973.3,515.0 Q973.3,527.0 985.3,527.0 L1036.0,527.0 Q1048.0,527.0 1048.0,539.0 L1048.0,563.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="992.4" y="512.0" width="36.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="1010.7" y="531.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">no</text><rect x="448.3" y="0.0" width="303.3" height="83.0" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(464.3,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="498.3" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">Directory of services</text><text x="464.3" y="64.0" font-size="16.5" fill="#334155">each with a service.yaml</text><rect x="448.3" y="135.0" width="303.3" height="64.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(464.3,149.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="498.3" y="171.0" font-size="21" font-weight="700" fill="#0B2A5B">catalog.collect</text><rect x="448.3" y="251.0" width="303