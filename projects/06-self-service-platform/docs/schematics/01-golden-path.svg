<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1698" viewBox="0 0 1200 1698" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">One command to a compliant service</title><desc id="d">One command to a compliant service. platformctl generates the repo, a policy check gates it, Terraform provisions the environment. A developer runs one command and gets a repository that already has code, tests, a hardened Dockerfile, Kubernetes manifests, a CI workflow, CODEOWNERS and a runbook. Generating and validating are implemented and tested. The pull request, plan, approval and apply half is the intended workflow: it is generated as files but has not been exercised end to end.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1696" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="249" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#1E1B4B">06 · DEVELOPER PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">One command to a compliant service</text><text x="40" y="151" font-size="21" fill="#475569">platformctl generates the repo, a policy check gates it, Terraform provisions the environment.</text><g transform="translate(0,191.0)"><path d="M600.0,125.0 L600.0,177.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,370.0 L600.0,432.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M721.7,465.2 L784.1,465.2 Q786.7,465.2 786.7,467.8 L786.7,467.8 Q786.7,470.4 789.3,470.4 L851.7,470.4" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M851.7,507.8 L789.9,507.8 