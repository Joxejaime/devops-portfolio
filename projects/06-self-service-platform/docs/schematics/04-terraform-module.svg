<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1297" viewBox="0 0 1200 1297" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Deploying with no long-lived AWS keys</title><desc id="d">Deploying with no long-lived AWS keys. A GitHub OIDC role scoped to one ECR repository, with prod locked to a reviewed environment. The deploy role trusts GitHub&#x27;s OIDC provider, so no AWS keys are stored anywhere. The job presents a token and the trust policy decides whether its subject is allowed. prod can only be assumed from the GitHub environment named prod, which can require reviewers. dev and staging can be assumed from main or release tags. This module is validated in CI and planned for Juega App once it reaches 5,000 users.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1295" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="249" height="30" rx="15" fill="#FFEEDC" stroke="#EA580C" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#431407">06 · DEVELOPER PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Deploying with no long-lived AWS keys</text><text x="40" y="151" font-size="21" fill="#475569">A GitHub OIDC role scoped to one ECR repository, with prod locked to a reviewed environment.</text><g transform="translate(0,191.0)"><rect x="44.0" y="593.0" width="1112.0" height="175.0" rx="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><path d="M600.0,83.0 L600.0,291.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M226.7,239.0 L226.7,333.0 Q226.7,345.0 238.7,345.0 L441.3,345.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M973.3,228.5 L973.3,333.0 Q973.3,345.0 961.3,345.0 L758.7,345.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M600.0,399.0 L600.0,451.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="559.8" y="410.0" width="80.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="429.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">matches</text><path d="M600.0,555.0 L600.0,589.0 Q600.0,601.0 588.0,601.0 L238.7,601.0 Q226.7,601.0 226.7,613.0 L226.7,647.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,555.0 L600.0,654.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M600.0,555.0 L600.0,592.5 Q600.0,604.5 612.0,604.5 L961.3,604.5 Q973.3,604.5 973.3,616.5 L973.3,654.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="52.0" y="601.0" width="243.4" height="26" rx="13" fill="#F8FAFC"/><text x="63.0" y="620.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#64748B">CREATED BY THE MODULE</text><rect x="441.3" y="0.0" width="317.3" height="83.0" rx="41.5" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(457.3,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="491.3" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">GitHub Actions job</text><text x="457.3" y="64.0" font-size="16.5" fill="#334155">presents an OIDC token</text><rect x="68.0" y="135.0" width="317.3" height="104.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(84.0,149.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="118.0" y="171.0" font-size="21" font-weight="700" fill="#6B0A20">prod subject</text><text x="84.0" y="199.0" font-size="16.5" fill="#334155">only from the GitHub environment</text><text x="84.0" y="220.0" font-size="16.5" fill="#334155">named prod</text><rect x="814.7" y="145.5" width="317.3" height="83.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(830.7,159.5) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="864.7" y="181.5" font-size="21" font-weight="700" fill="#06361A">dev and staging subject</text><text x="830.7" y="209.5" font-size="16.5" fill="#334155">from main or release tags v*</text><polygon points="463.3,291.0 736.7,291.0 758.7,345.0 736.7,399.0 463.3,399.0 441.3,345.0" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(475.3,305.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="509.3" y="327.0" font-size="21" font-weight="700" fill="#053F3A">Does the token</text><text x="509.3" y="353.0" font-size="21" font-weight="700" fill="#053F3A">subject match the</text><text x="509.3" y="379.0" font-size="21" font-weight="700" fill="#053F3A">trust policy?</text><rect x="441.3" y="451.0" width="317.3" height="104.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(457.3,465.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="491.3" y="487.0" font-size="21" font-weight="700" fill="#0B2A5B">IAM deploy role</text><text x="457.3" y="515.0" font-size="16.5" fill="#334155">can push images to this one ECR</text><text x="457.3" y="536.0" font-size="16.5" fill="#334155">repository only</text><path d="M68.0,658.0 v75.0 a158.7,11 0 0 0 317.3,0 v-75.0 a158.7,11 0 0 0 -317.3,0 z" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><path d="M68.0,658.0 a158.7,11 0 0 0 317.3,0" fill="none" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(84.0,671.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="118.0" y="693.0" font-size="21" font-weight="700" fill="#431407">ECR repository</text><text x="84.0" y="721.0" font-size="16.5" fill="#334155">immutable tags, scan on push</text><rect x="441.3" y="654.0" width="317.3" height="83.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(457.3,668.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="491.3" y="690.0" font-size="21" font-weight="700" fill="#431407">CloudWatch log group</text><text x="457.3" y="718.0" font-size="16.5" fill="#334155">configurable retention</text><rect x="814.7" y="654.0" width="317.3" height="83.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(830.7,668.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="864.7" y="690.0" font-size="21" font-weight="700" fill="#431407">Monthly AWS Budget</text><text x="830.7" y="718.0" font-size="16.5" fill="#334155">email alert at 80%</text></g><rect x="40" y="975" width="1120" height="214" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1011" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1039" r="3.6" fill="#94A3B8"/><text x="90" y="1049" font-size="18.5" fill="#1E293B">The deploy role trusts GitHub&#x27;s OIDC provider, so no AWS keys are stored anywhere. The job presents a token and the</text><text x="90" y="1075" font-size="18.5" fill="#1E293B">trust policy decides whether its subject is allowed.</text><circle cx="71" cy="1101" r="3.6" fill="#94A3B8"/><text x="90" y="1111" font-size="18.5" fill="#1E293B">prod can only be assumed from the GitHub environment named prod, which can require reviewers. dev and staging can</text><text x="90" y="1137" font-size="18.5" fill="#1E293B">be assumed from main or release tags. This module is validated in CI and planned for Juega App once it reaches 5,000</text><text x="90" y="1163" font-size="18.5" fill="#1E293B">users.</text><rect x="40" y="1211" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1227" font-size="15.5" fill="#334155">GitHub job</text><rect x="171.453125" y="1211" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="199.453125" y="1227" font-size="15.5" fill="#334155">Trust check</text><rect x="311.625" y="1211" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="339.625" y="1227" font-size="15.5" fill="#334155">Deploy role</text><rect x="448.8125" y="1211" width="20" height="20" rx="6" fill="#FFEEDC" stroke="#EA580C" stroke-width="2"/><text x="476.8125" y="1227" font-size="15.5" fill="#334155">AWS resource</text><rect x="606.921875" y="1211" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="634.921875" y="1227" font-size="15.5" fill="#334155">Prod subject</text><rect x="753.109375" y="1211" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="781.109375" y="1227" font-size="15.5" fill="#33