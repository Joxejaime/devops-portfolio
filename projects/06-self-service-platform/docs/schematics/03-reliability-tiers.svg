<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1016" viewBox="0 0 1200 1016" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">One choice, the reliability tier, sets the defaults</title><desc id="d">One choice, the reliability tier, sets the defaults. critical, standard or best-effort decides replicas, resources, SLO and disruption budget. A developer makes one reliability decision: which tier the service is. Everything else follows from it, so two services on the same tier behave the same way. The K8S009 rule rejects a manifest that asks for fewer replicas than its tier minimum, so the defaults cannot be quietly weakened.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1014" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="249" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#1E1B4B">06 · DEVELOPER PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">One choice, the reliability tier, sets the defaults</text><text x="40" y="151" font-size="21" fill="#475569">critical, standard or best-effort decides replicas, resources, SLO and disruption budget.</text><g transform="translate(0,191.0)"><path d="M600.0,83.0 L600.0,97.0 Q600.0,109.0 588.0,109.0 L238.7,109.0 Q226.7,109.0 226.7,121.0 L226.7,135.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,83.0 L600.0,135.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,83.0 L600.0,97.0 Q600.0,109.0 612.0,109.0 L961.3,109.0 Q973.3,109.0 973.3,121.0 L973.3,135.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M226.7,281.0 L226.7,295.0 Q226.7,307.0 238.7,307.0 L588.0,307.0 Q600.0,307.0 600.0,319.0 L600.0,333.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,281.0 L600.0,333.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M973.3,281.0 L973.3,295.0 Q973.3,307.0 961.3,307.0 L612.0,307.0 Q600.0,307.0 600.0,319.0 L600.0,333.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="441.3" y="0.0" width="317.3" height="83.0" rx="41.5" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(457.3,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="491.3" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">service.yaml</text><text x="457.3" y="64.0" font-size="16.5" fill="#334155">tier: critical, standard or best-effort</text><rect x="68.0" y="135.0" width="317.3" height="146.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(84.0,149.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="118.0" y="171.0" font-size="21" font-weight="700" fill="#431407">critical</text><text x="84.0" y="199.0" font-size="16.5" fill="#334155">3 replicas, SLO 99.95%</text><text x="84.0" y="220.0" font-size="16.5" fill="#334155">disruption budget: 2 always up</text><text x="84.0" y="241.0" font-size="16.5" fill="#334155">CPU 250m to 1000m, memory 256</text><text x="84.0" y="262.0" font-size="16.5" fill="#334155">to 512Mi</text><rect x="441.3" y="135.0" width="317.3" height="146.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(457.3,149.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="491.3" y="171.0" font-size="21" font-weight="700" fill="#0B2A5B">standard</text><text x="457.3" y="199.0" font-size="16.5" fill="#334155">2 replicas, SLO 99.9%</text><text x="457.3" y="220.0" font-size="16.5" fill="#334155">disruption budget: 1 always up</text><text x="457.3" y="241.0" font-size="16.5" fill="#334155">CPU 100m to 500m, memory 128 to</text><text x="457.3" y="262.0" font-size="16.5" fill="#334155">256Mi</text><rect x="814.7" y="135.0" width="317.3" height="146.0" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/><g transform="translate(830.7,149.0) scale(1.083)" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="864.7" y="171.0" font-size="21" font-weight="700" fill="#0F172A">best-effort</text><text x="830.7" y="199.0" font-size="16.5" fill="#334155">1 replica, SLO 99.0%</text><text x="830.7" y="220.0" font-size="16.5" fill="#334155">no disruption budget</text><text x="830.7" y="241.0" font-size="16.5" fill="#334155">CPU 50m to 250m, memory 64 to</text><text x="830.7" y="262.0" font-size="16.5" fill="#334155">128Mi</text><rect x="441.3" y="333.0" width="317.3" height="156.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(457.3,347.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="491.3" y="369.0" font-size="21" font-weight="700" fill="#4D2B00">Generated Deployment</text><text x="491.3" y="395.0" font-size="21" font-weight="700" fill="#4D2B00">and</text><text x="491.3" y="421.0" font-size="21" font-weight="700" fill="#4D2B00">PodDisruptionBudget</text><text x="457.3" y="449.0" font-size="16.5" fill="#334155">K8S009 enforces the replica</text><text x="457.3" y="470.0" font-size="16.5" fill="#334155">minimum</text></g><rect x="40" y="720" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="756" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="784" r="3.6" fill="#94A3B8"/><text x="90" y="794" font-size="18.5" fill="#1E293B">A developer makes one reliability decision: which tier the service is. Everything else follows from it, so two services on</text><text x="90" y="820" font-size="18.5" fill="#1E293B">the same tier behave the same way.</text><circle cx="71" cy="846" r="3.6" fill="#94A3B8"/><text x="90" y="856" font-size="18.5" fill="#1E293B">The K8S009 rule rejects a manifest that asks for fewer replicas than its tier minimum, so the defaults cannot be quietly</text><text x="90" y="882" font-size="18.5" fill="#1E293B">weakened.</text><rect x="40" y="930" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="946" font-size="15.5" fill="#334155">Developer choice</text><rect x="222.09375" y="930" width="20" height="20" rx="6" fill="#FFEEDC" stroke="#EA580C" stroke-width="2"/><text x="250.09375" y="946" font-size="15.5" fill="#334155">critical</text><rect x="325.078125" y="930" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="353.078125" y="946" font-size="15.5" fill="#334155">standard</text><rect x="443.53125" y="930" width="20" height="20" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="471.53125" y="946" font-size="15.5" fill="#334155">best-effort</text><rect x="576.03125" y="930" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="604.03125" y="946" font-size="15.5" fill="#334155">Generated defaults</text><text x="40" y="980" font-size="14" fill="#94A3B8">Source: platformctl/models.py (TIER_DEFAULTS)</text></svg>
