<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1827" viewBox="0 0 1200 1827" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">From commit to on-call in four connected projects</title><desc id="d">From commit to on-call in four connected projects. One signed image is built once, deployed two ways, and watched against SLOs. Project 01 builds and signs one container image. Projects 02 and 03 run that same image, one on AWS with Terraform and one on Kubernetes with Argo CD. Both expose /metrics. Project 04 turns those metrics into alerts that page the on-call engineer, who follows a runbook and rolls back or fixes forward.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1825" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="387" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#1E1B4B">START HERE · FOUR PROJECTS, ONE SERVICE</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">From commit to on-call in four connected projects</text><text x="40" y="151" font-size="21" fill="#475569">One signed image is built once, deployed two ways, and watched against SLOs.</text><g transform="translate(0,191.0)"><rect x="790.7" y="509.5" width="365.3" height="476.5" rx="20" fill="#F3F8FF" stroke="#2563EB" stroke-width="1.6"/><rect x="44.0" y="1014.0" width="1112.0" height="161.0" rx="20" fill="#F8F5FF" stroke="#7C3AED" stroke-width="1.6"/><rect x="417.3" y="499.0" width="365.3" height="338.0" rx="20" fill="#FFF8F1" stroke="#EA580C" stroke-width="1.6"/><rect x="44.0" y="121.0" width="365.3" height="310.0" rx="20" fill="#F2FCFA" stroke="#0D9488" stroke-width="1.6"/><path 