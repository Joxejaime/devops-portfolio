<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1535" viewBox="0 0 1200 1535" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">From fault to page to resolved</title><desc id="d">From fault to page to resolved. Measured end to end with real Prometheus and Alertmanager binaries. A fault makes the service return errors. Prometheus sees both windows cross the threshold and marks the alert pending, then firing once it has held for two minutes. Alertmanager groups it and sends a page that links to the runbook. When the errors stop, a resolved message follows, and the team writes a blameless postmortem.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1533" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="276" height="30" rx="15" fill="#F0EAFF" stroke="#7C3AED" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#2E1065">04 · OBSERVABILITY AND SLOS</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">From fault to page to resolved</text><text x="40" y="151" font-size="21" fill="#475569">Measured end to end with real Prometheus and Alertmanager binaries.</text><line x1="152.0" y1="245" x2="152.0" y2="1245" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="376.0" y1="245" x2="376.0" y2="1245" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="600.0" y1="245" x2="600.0" y2="1245" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="824.0" y1="245" x2="824.0" y2="1245" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><line x1="1048.0" y1="245" x2="1048.0" y2="1245" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/><rect x="52.0" y="187" width="200.0" 