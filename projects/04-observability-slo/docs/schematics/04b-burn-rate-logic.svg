<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1497" viewBox="0 0 1200 1497" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Fast on real outages, quiet on blips</title><desc id="d">Fast on real outages, quiet on blips. Each alert needs a long and a short window above threshold; pages suppress tickets. Burn rate is how fast the error budget is being spent. At 1x the budget lasts exactly 30 days; at 14.4x it is gone in about two days. An alert fires only when a long window and a short window are both over the threshold. The long one proves it is significant, the short one proves it is still happening, so alerts clear soon after a fix.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1495" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="276" height="30" rx="15" fill="#FFE8EC" stroke="#E11D48" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#6B0A20">04 · OBSERVABILITY AND SLOS</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Fast on real outages, quiet on blips</text><text x="40" y="151" font-size="21" fill="#475569">Each alert needs a long and a short window above threshold; pages suppress tickets.</text><g transform="translate(0,191.0)"><rect x="44.0" y="277.0" width="1112.0" height="296.0" rx="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><path d="M600.0,83.0 L600.0,135.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,239.0 L600.0,273.0 Q600.0,285.0 588.0,285.0 L332.0,285.0 Q320.0,285.0 320.0,297.0 L320.0,331.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,239.0 L600.0,273.0 Q600.0,285.0 612.0,285.0 L868.0,285.0 Q880.0,285.0 880.0,297.0 L880.0,331.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M320.0,549.0 L320.0,625.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M880.0,549.0 L880.0,575.2 Q880.0,587.2 868.0,587.2 L332.0,587.2 Q320.0,587.2 320.0,599.2 L320.0,625.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M320.0,708.5 L320.0,727.8 Q320.0,739.8 332.0,739.8 L588.0,739.8 Q600.0,739.8 600.0,751.8 L600.0,771.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,835.0 L600.0,849.0 Q600.0,861.0 588.0,861.0 L332.0,861.0 Q320.0,861.0 320.0,873.0 L320.0,887.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="438.2" y="846.0" width="43.6" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="460.0" y="865.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">yes</text><path d="M600.0,835.0 L600.0,853.8 Q600.0,865.8 612.0,865.8 L868.0,865.8 Q880.0,865.8 880.0,877.8 L880.0,896.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="721.8" y="850.8" width="36.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="740.0" y="869.8" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">no</text><rect x="52.0" y="285.0" width="904.6" height="26" rx="13" fill="#F8FAFC"/><text x="63.0" y="304.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#64748B">AVAILABILITY ALERTS (LATENCY USES THE SAME PATTERN: 6X PAGE, 1X TICKET). P = PAGE, T = TICKET.</text><rect x="254.7" y="0.0" width="690.7" height="83.0" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(270.7,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="304.7" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">SLO</text><text x="270.7" y="64.0" font-size="16.5" fill="#334155">99.5 percent of /api requests are not 5xx; error budget is 0.5 percent over 30 days</text><rect x="254.7" y="135.0" width="690.7" height="104.0" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/><g transform="translate(270.7,149.0) scale(1.083)" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="304.7" y="171.0" font-size="21" font-weight="700" fill="#0F172A">Burn rate</text><text x="270.7" y="199.0" font-size="16.5" fill="#334155">observed error ratio divided by the error budget; 1x spends the budget exactly in 30</text><text x="270.7" y="220.0" font-size="16.5" fill="#334155">days</text><rect x="68.0" y="331.0" width="504.0" height="83.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(84.0,345.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="118.0" y="367.0" font-size="21" font-weight="700" fill="#6B0A20">Fast: 14.4x</text><text x="84.0" y="395.0" font-size="16.5" fill="#334155">windows 1h and 5m, hold 2m; threshold 7.2 percent errors</text><circle cx="70.0" cy="333.0" r="15" fill="#E11D48" stroke="#fff" stroke-width="3"/><text x="70.0" y="339.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">P</text><rect x="628.0" y="331.0" width="504.0" height="83.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(644.0,345.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="678.0" y="367.0" font-size="21" font-weight="700" fill="#6B0A20">Medium: 6x</text><text x="644.0" y="395.0" font-size="16.5" fill="#334155">windows 6h and 30m, hold 15m; threshold 3 percent</text><circle cx="630.0" cy="333.0" r="15" fill="#E11D48" stroke="#fff" stroke-width="3"/><text x="630.0" y="339.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">P</text><rect x="68.0" y="466.0" width="504.0" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(84.0,480.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="118.0" y="502.0" font-size="21" font-weight="700" fill="#4D2B00">Slow: 3x</text><text x="84.0" y="530.0" font-size="16.5" fill="#334155">windows 1d and 2h, hold 1h; threshold 1.5 percent</text><circle cx="70.0" cy="468.0" r="15" fill="#D97706" stroke="#fff" stroke-width="3"/><text x="70.0" y="474.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">T</text><rect x="628.0" y="466.0" width="504.0" height="83.0" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><g transform="translate(644.0,480.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="678.0" y="502.0" font-size="21" font-weight="700" fill="#4D2B00">Leak: 1x</text><text x="644.0" y="530.0" font-size="16.5" fill="#334155">windows 3d and 6h, hold 3h; threshold 0.5 percent</text><circle cx="630.0" cy="468.0" r="15" fill="#D97706" stroke="#fff" stroke-width="3"/><text x="630.0" y="474.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">T</text><rect x="68.0" y="625.5" width="504.0" height="83.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(84.0,639.5) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="118.0" y="661.5" font-size="21" font-weight="700" fill="#2E1065">Alertmanager routes by severity</text><text x="84.0" y="689.5" font-size="16.5" fill="#334155">page goes to the pager receiver, ticket to the ticket receiver</text><rect x="628.0" y="615.0" width="504.0" height="104.0" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/><g transform="translate(644.0,629.0) scale(1.083)" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text x="678.0" y="651.0" font-size="21" font-weight="700" fill="#0F172A">Why two windows</text><text x="644.0" y="679.0" font-size="16.5" fill="#334155">Long: is it real and significant? Short: is it still happening</text><text x="644.0" y="700.0" font-size="16.5" fill="#334155">right now? Together: fast to fire, fast to clear.</text><polygon points="90.0,771.0 1110.0,771.0 1132.0,803.0 1110.0,835.0 90.0,835.0 68.0,803.0" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(102.0,785.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="136.0" y="807.0" font-size="21" font-weight="700" fill="#053F3A">Ticket alert while a page alert is firing for the same service and SLO?</text><rect x="68.0" y="887.0" width="504.0" height="83.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(84.0,901.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="118.0" y="923.0" font-size="21" font-weight="700" fill="#06361A">Ticket suppressed by inhibition</text><text x="84.0" y="951.0" font-size="16.5" fill="#334155">on-call is not notified twice</text><rect x="628.0" y="896.5" width="504.0" height="64.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(644.0,910.5) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="678.0" y="932.5" font-size="21" font-weight="700" fill="#0B2A5B">Delivered to the receiver</text></g><rect x="40" y="1201" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1237" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1265" r="3.6" fill="#94A3B8"/><text x="90" y="1275" font-size="18.5" fill="#1E293B">Burn rate is how fast the error budget is being spent. At 1x the budget lasts exactly 30 days; at 14.4x it is gone in about</text><text x="90" y="1301" font-size="18.5" fill="#1E293B">two days.</text><circle cx="71" cy="1327" r="3.6" fill="#94A3B8"/><text x="90" y="1337" font-size="18.5" fill="#1E293B">An alert fires only when a long window and a short window are both over the threshold. The long one proves it is</text><text x="90" y="1363" font-size="18.5" fill="#1E293B">significant, the short one proves it is still happening, so alerts clear soon after a fix.</text><rect x="40" y="1411" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1427" font-size="15.5" fill="#334155">SLO</text><rect x="124.125" y="1411" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="152.125" y="1427" font-size="15.5" fill="#334155">Page</text><rect x="215.265625" y="1411" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="243.265625" y="1427" font-size="15.5" fill="#334155">Ticket</text><rect x="314.140625" y="1411" width="20" height="20" rx="6" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2"/><text x="342.140625" y="1427" font-size="15.5" fill="#334155">Routing</text><rect x="423.828125" y="1411" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="451.828125" y="1427" font-size="15.5" fill="#334155">Inhibition</text><rect x="544.578125" y="1411" width="20" height="20" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="572.578125" y="1427" font-size="15.5" fill="#334155">Explanation</text><text x="40" y="1461" font-size="14" fill="#94A3B8">Source: docs/slo.md and prometheus/gen_slo_rules.py</text></svg>
