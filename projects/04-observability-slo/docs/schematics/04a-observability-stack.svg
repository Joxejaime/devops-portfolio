<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1607" viewBox="0 0 1200 1607" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Alert rules and dashboards are generated, not hand-written</title><desc id="d">Alert rules and dashboards are generated, not hand-written. One SLO definition produces the rules and the dashboard; CI fails on drift. A load generator sends traffic with adjustable error and slowness. Prometheus measures it, records error ratios, and evaluates the burn-rate alerts. Alertmanager routes pages and tickets, and every alert carries a runbook link. The rules and the dashboard are written by scripts from one source, and CI fails if the committed files drift from it.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1605" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="276" height="30" rx="15" fill="#F0EAFF" stroke="#7C3AED" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#2E1065">04 · OBSERVABILITY AND SLOS</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Alert rules and dashboards are generated, not hand-written</text><text x="40" y="151" font-size="21" fill="#475569">One SLO definition produces the rules and the dashboard; CI fails on drift.</text><g transform="translate(0,191.0)"><rect x="417.3" y="142.0" width="365.3" height="475.0" rx="20" fill="#F8F5FF" stroke="#7C3AED" stroke-width="1.6"/><path d="M385.3,52.0 L441.3,52.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,104.0 L600.0,196.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,260.0 L600.0,322.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,426.5 L600.0,489.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M441.3,374.5 L385.3,374.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,593.0 L600.0,659.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,742.0 L600.0,794.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,919.0 L600.0,971.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M814.7,374.5 L758.7,374.5" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M814.7,374.5 L798.7,374.5 Q786.7,374.5 786.7,386.5 L786.7,529.0 Q786.7,541.0 774.7,541.0 L758.7,541.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><path d="M973.3,437.0 L973.3,614.0 Q973.3,626.0 961.3,626.0 L238.7,626.0 Q226.7,626.0 226.7,614.0 L226.7,416.0" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arr)"/><rect x="537.3" y="611.0" width="125.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="630.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">writes all three</text><rect x="425.3" y="150.0" width="138.8" height="26" rx="13" fill="#F8F5FF"/><text x="436.3" y="169.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#7C3AED">PROMETHEUS</text><rect x="68.0" y="10.5" width="317.3" height="83.0" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(84.0,24.5) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="118.0" y="46.5" font-size="21" font-weight="700" fill="#1E1B4B">Load generator</text><text x="84.0" y="74.5" font-size="16.5" fill="#334155">RPS, ERROR_RATE, SLOW_RATE</text><rect x="441.3" y="0.0" width="317.3" height="104.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(457.3,14.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="491.3" y="36.0" font-size="21" font-weight="700" fill="#0B2A5B">release-tracker</text><text x="457.3" y="64.0" font-size="16.5" fill="#334155">/metrics; /api/simulate when</text><text x="457.3" y="85.0" font-size="16.5" fill="#334155">ENABLE_CHAOS=true</text><rect x="814.7" y="312.0" width="317.3" height="125.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(830.7,326.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="864.7" y="348.0" font-size="21" font-weight="700" fill="#053F3A">Generators</text><text x="830.7" y="376.0" font-size="16.5" fill="#334155">gen_slo_rules.py and</text><text x="830.7" y="397.0" font-size="16.5" fill="#334155">build_dashboard.py: one source of</text><text x="830.7" y="418.0" font-size="16.5" fill="#334155">truth, drift checked in CI</text><rect x="441.3" y="196.0" width="317.3" height="64.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(457.3,210.0) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="491.3" y="232.0" font-size="21" font-weight="700" fill="#2E1065">Scrape every 15 s</text><rect x="441.3" y="322.5" width="317.3" height="104.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(457.3,336.5) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="491.3" y="358.5" font-size="21" font-weight="700" fill="#2E1065">Recording rules</text><text x="457.3" y="386.5" font-size="16.5" fill="#334155">error ratio over 5m, 30m, 1h, 2h, 6h,</text><text x="457.3" y="407.5" font-size="16.5" fill="#334155">1d, 3d</text><rect x="441.3" y="489.0" width="317.3" height="104.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(457.3,503.0) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="491.3" y="525.0" font-size="21" font-weight="700" fill="#2E1065">Alert rules</text><text x="457.3" y="553.0" font-size="16.5" fill="#334155">4 availability and 2 latency burn</text><text x="457.3" y="574.0" font-size="16.5" fill="#334155">rates, TargetDown, CrashLooping</text><rect x="68.0" y="333.0" width="317.3" height="83.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(84.0,347.0) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="118.0" y="369.0" font-size="21" font-weight="700" fill="#2E1065">Grafana</text><text x="84.0" y="397.0" font-size="16.5" fill="#334155">dashboard provisioned from code</text><rect x="441.3" y="659.0" width="317.3" height="83.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(457.3,673.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="491.3" y="695.0" font-size="21" font-weight="700" fill="#6B0A20">Alertmanager</text><text x="457.3" y="723.0" font-size="16.5" fill="#334155">group, route by severity, inhibit</text><rect x="441.3" y="794.0" width="317.3" height="125.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(457.3,808.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="491.3" y="830.0" font-size="21" font-weight="700" fill="#6B0A20">Receivers</text><text x="457.3" y="858.0" font-size="16.5" fill="#334155">page and ticket: a webhook sink in</text><text x="457.3" y="879.0" font-size="16.5" fill="#334155">the lab, Slack or PagerDuty in real</text><text x="457.3" y="900.0" font-size="16.5" fill="#334155">life</text><rect x="441.3" y="971.0" width="317.3" height="109.0" rx="54.5" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(457.3,985.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="491.3" y="1007.0" font-size="21" font-weight="700" fill="#06361A">On-call follows the</text><text x="491.3" y="1033.0" font-size="21" font-weight="700" fill="#06361A">runbook</text><text x="457.3" y="1061.0" font-size="16.5" fill="#334155">the link is carried in the alert</text></g><rect x="40" y="1311" width="1120" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="1347" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="1375" r="3.6" fill="#94A3B8"/><text x="90" y="1385" font-size="18.5" fill="#1E293B">A load generator sends traffic with adjustable error and slowness. Prometheus measures it, records error ratios, and</text><text x="90" y="1411" font-size="18.5" fill="#1E293B">evaluates the burn-rate alerts.</text><circle cx="71" cy="1437" r="3.6" fill="#94A3B8"/><text x="90" y="1447" font-size="18.5" fill="#1E293B">Alertmanager routes pages and tickets, and every alert carries a runbook link. The rules and the dashboard are written</text><text x="90" y="1473" font-size="18.5" fill="#1E293B">by scripts from one source, and CI fails if the committed files drift from it.</text><rect x="40" y="1521" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1537" font-size="15.5" fill="#334155">Traffic</text><rect x="141.125" y="1521" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="169.125" y="1537" font-size="15.5" fill="#334155">Service</text><rect x="250.53125" y="1521" width="20" height="20" rx="6" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2"/><text x="278.53125" y="1537" font-size="15.5" fill="#334155">Prometheus and Grafana</text><rect x="486.78125" y="1521" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="514.78125" y="1537" font-size="15.5" fill="#334155">Alert routing</text><rect x="631.296875" y="1521" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="659.296875" y="1537" font-size="15.5" fill="#334155">Generators</text><rect x="766.84375" y="1521" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="794.84375" y="1537" font-size="15.5" fill="#334155">Human response</text><text x="40" y="1571" font-size="14" fill="#94A3B8">Source: docker-compose.yml, prometheus/gen_slo_rules.py and grafana/build_dashboard.py</text></svg>
