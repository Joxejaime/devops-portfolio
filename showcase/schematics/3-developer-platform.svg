="216.0" font-size="16.5" fill="#334155">scaffold a service</text><circle cx="72.0" cy="128.0" r="15" fill="#2563EB" stroke="#fff" stroke-width="3"/><text x="72.0" y="134.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><rect x="350.0" y="126.0" width="220.0" height="110.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(366.0,140.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="400.0" y="162.0" font-size="21" font-weight="700" fill="#0B2A5B">platformctl</text><text x="400.0" y="188.0" font-size="21" font-weight="700" fill="#0B2A5B">validate</text><text x="366.0" y="216.0" font-size="16.5" fill="#334155">check any repository</text><circle cx="352.0" cy="128.0" r="15" fill="#2563EB" stroke="#fff" stroke-width="3"/><text x="352.0" y="134.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><rect x="630.0" y="116.0" width="220.0" height="130.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(646.0,130.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="680.0" y="152.0" font-size="21" font-weight="700" fill="#0B2A5B">platformctl env</text><text x="680.0" y="178.0" font-size="21" font-weight="700" fill="#0B2A5B">add</text><text x="646.0" y="206.0" font-size="16.5" fill="#334155">request a cloud</text><text x="646.0" y="227.0" font-size="16.5" fill="#334155">environment</text><circle cx="632.0" cy="118.0" r="15" fill="#2563EB" stroke="#fff" stroke-width="3"/><text x="632.0" y="124.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><rect x="910.0" y="126.0" width="220.0" height="110.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(926.0,140.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="960.0" y="162.0" font-size="21" font-weight="700" fill="#0B2A5B">platformctl</text><text x="960.0" y="188.0" font-size="21" font-weight="700" fill="#0B2A5B">catalog</text><text x="926.0" y="216.0" font-size="16.5" fill="#334155">list every service</text><circle cx="912.0" cy="128.0" r="15" fill="#2563EB" stroke="#fff" stroke-width="3"/><text x="912.0" y="134.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><rect x="70.0" y="308.5" width="220.0" height="172.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(86.0,322.5) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="120.0" y="344.5" font-size="21" font-weight="700" fill="#06361A">A service that</text><text x="120.0" y="370.5" font-size="21" font-weight="700" fill="#06361A">already passes</text><text x="86.0" y="398.5" font-size="16.5" fill="#334155">pinned image, limits,</text><text x="86.0" y="419.5" font-size="16.5" fill="#334155">non-root, readiness</text><text x="86.0" y="440.5" font-size="16.5" fill="#334155">probe, owner labels,</text><text x="86.0" y="461.5" font-size="16.5" fill="#334155">own tests and runbook</text><rect x="350.0" y="309.5" width="220.0" height="170.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(366.0,323.5) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="400.0" y="345.5" font-size="21" font-weight="700" fill="#06361A">Findings by</text><text x="400.0" y="371.5" font-size="21" font-weight="700" fill="#06361A">rule ID</text><text x="366.0" y="399.5" font-size="16.5" fill="#334155">K8S001 to K8S011 and</text><text x="366.0" y="420.5" font-size="16.5" fill="#334155">friends, so you know</text><text x="366.0" y="441.5" font-size="16.5" fill="#334155">which guardrail failed</text><rect x="630.0" y="298.0" width="220.0" height="193.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(646.0,312.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="680.0" y="334.0" font-size="21" font-weight="700" fill="#06361A">A Terraform</text><text x="680.0" y="360.0" font-size="21" font-weight="700" fill="#06361A">pull request</text><text x="646.0" y="388.0" font-size="16.5" fill="#334155">image repository with</text><text x="646.0" y="409.0" font-size="16.5" fill="#334155">immutable tags and</text><text x="646.0" y="430.0" font-size="16.5" fill="#334155">scan on push, OIDC</text><text x="646.0" y="451.0" font-size="16.5" fill="#334155">deploy role, log group,</text><text x="646.0" y="472.0" font-size="16.5" fill="#334155">monthly budget alert</text><rect x="910.0" y="309.5" width="220.0" height="170.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(926.0,323.5) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="960.0" y="345.5" font-size="21" font-weight="700" fill="#06361A">An ownership</text><text x="960.0" y="371.5" font-size="21" font-weight="700" fill="#06361A">catalog</text><text x="926.0" y="399.5" font-size="16.5" fill="#334155">built from every</text><text x="926.0" y="420.5" font-size="16.5" fill="#334155">service.yaml: what</text><text x="926.0" y="441.5" font-size="16.5" fill="#334155">exists and who owns it</text><rect x="70.0" y="543.0" width="500.0" height="104.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(86.0,557.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="120.0" y="579.0" font-size="21" font-weight="700" fill="#053F3A">Reliability tiers set the defaults</text><text x="86.0" y="607.0" font-size="16.5" fill="#334155">critical: 3 replicas, disruption budget of 2, 99.95%</text><text x="86.0" y="628.0" font-size="16.5" fill="#334155">objective. best-effort: 1 replica, 99.0%</text><rect x="630.0" y="543.0" width="500.0" height="104.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(646.0,557.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="680.0" y="579.0" font-size="21" font-weight="700" fill="#053F3A">Tests prove the guardrails</text><text x="646.0" y="607.0" font-size="16.5" fill="#334155">every rule has a mutation test; a new service must pass at</text><text x="646.0" y="628.0" font-size="16.5" fill="#334155">every tier</text></g><rect x="40" y="907" width="1120" height="250" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="943" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="971" r="3.6" fill="#94A3B8"/><text x="90" y="981" font-size="18.5" fill="#1E293B">A developer runs platformctl new and gets code, tests, a hardened container, Kubernetes manifests, a CI pipeline and a</text><text x="90" y="1007" font-size="18.5" fill="#1E293B">runbook, all of which already pass the policy checks.</text><circle cx="71" cy="1033" r="3.6" fill="#94A3B8"/><text x="90" y="1043" font-size="18.5" fill="#1E293B">platformctl validate checks any repository against numbered rules, so a failure names the exact guardrail. env add turns</text><text x="90" y="1069" font-size="18.5" fill="#1E293B">an environment request into a reviewable Terraform pull request, and catalog answers what exists and who owns it.</text><circle cx="71" cy="1095" r="3.6" fill="#94A3B8"/><text x="90" y="1105" font-size="18.5" fill="#1E293B">Each rule has a mutation test: it breaks exactly one thing and expects the checker to name that rule. The tier a service</text><text x="90" y="1131" font-size="18.5" fill="#1E293B">declares decides its defaults.</text><rect x="40" y="1179" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1195" font-size="15.5" fill="#334155">Developer</text><rect x="168.765625" y="1179" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="196.765625" y="1195" font-size="15.5" fill="#334155">platformctl command</text><rect x="378.34375" y="1179" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="406.34375" y="1195" font-size="15.5" fill="#334155">Result</text><rect x="477.53125" y="1179" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="505.53125" y="1195" font-size="15.5" fill="#334155">Guardrails</text><text x="40" y="1229" font-size="14" fill="#94A3B8">Source: projects/06-self-service-platform</text></svg>
