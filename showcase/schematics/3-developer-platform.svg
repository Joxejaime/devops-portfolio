<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1265" viewBox="0 0 1200 1265" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Make the secure path the easy path</title><desc id="d">Make the secure path the easy path. One command gives a developer a production-shaped service, and the same rules audit services that already exist. Project 06. A developer runs platformctl new and gets code, tests, a hardened container, Kubernetes manifests, a CI pipeline and a runbook, all of which already pass the policy checks. platformctl validate checks any repository against numbered rules, so a failure names the exact guardrail. env add turns an environment request into a reviewable Terraform pull request, and catalog answers what exists and who owns it. Each rule has a mutation test: it breaks exactly one thing and expects the checker to name that rule. The tier a service declares decides its defaults.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1263" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="328" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#1E1B4B">CATEGORY 3 · DEVELOPER PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">Make the secure path the easy path</text><text x="40" y="151" font-size="21" fill="#475569">One command gives a developer a production-shaped service, and the same rules audit services that already</text><text x="40" y="180" font-size="21" fill="#475569">exist. Project 06.</text><g transform="translate(0,220.0)"><path d="M600.0,64.0 L600.0,83.0 Q600.0,95.0 588.0,95.0 L192.0,95.0 Q180.0,95.0 180.0,107.0 L180.0,126.0" fil