<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1073" viewBox="0 0 1200 1073" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">What happens when it breaks?</title><desc id="d">What happens when it breaks?. Three answers: keep serving, prove it with numbers, and recover with evidence. Projects 05, 07 and 08. Stay up: the AI gateway retries with jitter, opens a circuit breaker on a failing provider, falls back to another one, and limits each tenant so one noisy customer cannot use everyone&#x27;s capacity. Prove it: reliability is written as three SLOs in one file. Alerts are generated from it, and a chaos runner breaks a demo service and checks what happened. Recover: drpilot opens an incident, runs the matching playbook and writes a postmortem draft. It leaves the root cause as a TODO for a human instead of guessing. The 05 outage test is a single local run with mock providers.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1071" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="369" height="30" rx="15" fill="#FFE8EC" stroke="#E11D48" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#6B0A20">CATEGORY 2 · RELIABILITY AND RECOVERY</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">What happens when it breaks?</text><text x="40" y="151" font-size="21" fill="#475569">Three answers: keep serving, prove it with numbers, and recover with evidence. Projects 05, 07 and 08.</text><g transform="translate(0,191.0)"><path d="M600.0,64.0 L600.0,78.0 Q600.0,90.0 588.0,90.0 L238.7,90.0 Q226.7,90.0 226.7,102.0 L226.7,116.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,64.0 L600.0,116.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,64.0 L600.0,78.0 Q600.0,90.0 612.0,90.0 L961.3,90.0 Q973.3,90.0 973.3,102.0 L973.3,116.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M226.7,286.0 L226.7,338.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M600.0,286.0 L600.0,338.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M973.3,286.0 L973.3,338.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="75.0" y="0.0" width="1050.0" height="64.0" rx="32.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(91.0,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="125.0" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">A dependency fails, a deploy goes wrong, a backup rots</text><rect x="75.0" y="116.0" width="303.3" height="170.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(91.0,130.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="125.0" y="152.0" font-size="21" font-weight="700" fill="#0B2A5B">Stay up (05)</text><text x="91.0" y="180.0" font-size="16.5" fill="#334155">retries with full jitter and</text><text x="91.0" y="201.0" font-size="16.5" fill="#334155">deadlines, a circuit breaker per</text><text x="91.0" y="222.0" font-size="16.5" fill="#334155">provider, fallback provider,</text><text x="91.0" y="243.0" font-size="16.5" fill="#334155">per-tenant rate limits and budget</text><text x="91.0" y="264.0" font-size="16.5" fill="#334155">caps, response cache</text><circle cx="77.0" cy="118.0" r="15" fill="#2563EB" stroke="#fff" stroke-width="3"/><text x="77.0" y="124.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><rect x="448.3" y="116.0" width="303.3" height="170.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(464.3,130.0) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="498.3" y="152.0" font-size="21" font-weight="700" fill="#2E1065">Prove it (07)</text><text x="464.3" y="180.0" font-size="16.5" fill="#334155">one SLO file generates the</text><text x="464.3" y="201.0" font-size="16.5" fill="#334155">burn-rate alerts; a simulator</text><text x="464.3" y="222.0" font-size="16.5" fill="#334155">replays incidents; a chaos runner</text><text x="464.3" y="243.0" font-size="16.5" fill="#334155">injects faults and writes a</text><text x="464.3" y="264.0" font-size="16.5" fill="#334155">game-day report</text><circle cx="450.3" cy="118.0" r="15" fill="#7C3AED" stroke="#fff" stroke-width="3"/><text x="450.3" y="124.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><rect x="821.7" y="116.0" width="303.3" height="170.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(837.7,130.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="871.7" y="152.0" font-size="21" font-weight="700" fill="#053F3A">Recover (08)</text><text x="837.7" y="180.0" font-size="16.5" fill="#334155">opens an incident, runs the</text><text x="837.7" y="201.0" font-size="16.5" fill="#334155">playbook, calls it recovered only</text><text x="837.7" y="222.0" font-size="16.5" fill="#334155">after healthy probes and passing</text><text x="837.7" y="243.0" font-size="16.5" fill="#334155">data checks, then drafts the</text><text x="837.7" y="264.0" font-size="16.5" fill="#334155">postmortem</text><circle cx="823.7" cy="118.0" r="15" fill="#0D9488" stroke="#fff" stroke-width="3"/><text x="823.7" y="124.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><rect x="75.0" y="338.0" width="303.3" height="146.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(91.0,352.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="125.0" y="374.0" font-size="21" font-weight="700" fill="#06361A">Measured</text><text x="91.0" y="402.0" font-size="16.5" fill="#334155">Primary provider down: 180 of 180</text><text x="91.0" y="423.0" font-size="16.5" fill="#334155">requests still succeeded. Median</text><text x="91.0" y="444.0" font-size="16.5" fill="#334155">290 ms against 140 ms when</text><text x="91.0" y="465.0" font-size="16.5" fill="#334155">healthy.</text><rect x="448.3" y="338.0" width="303.3" height="146.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(464.3,352.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="498.3" y="374.0" font-size="21" font-weight="700" fill="#06361A">Measured</text><text x="464.3" y="402.0" font-size="16.5" fill="#334155">A 5% error rate for 30 minutes</text><text x="464.3" y="423.0" font-size="16.5" fill="#334155">pages after 18 minutes, with 2.2%</text><text x="464.3" y="444.0" font-size="16.5" fill="#334155">of the monthly budget spent. Both</text><text x="464.3" y="465.0" font-size="16.5" fill="#334155">game-day hypotheses held.</text><rect x="821.7" y="338.0" width="303.3" height="146.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(837.7,352.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="871.7" y="374.0" font-size="21" font-weight="700" fill="#06361A">Measured</text><text x="837.7" y="402.0" font-size="16.5" fill="#334155">85 tests on a real PostgreSQL 16.</text><text x="837.7" y="423.0" font-size="16.5" fill="#334155">Three drills: a clean restore, a</text><text x="837.7" y="444.0" font-size="16.5" fill="#334155">poisoned backup skipped, a rotted</text><text x="837.7" y="465.0" font-size="16.5" fill="#334155">backup refused and escalated.</text></g><rect x="40" y="715" width="1120" height="250" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="751" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="779" r="3.6" fill="#94A3B8"/><text x="90" y="789" font-size="18.5" fill="#1E293B">Stay up: the AI gateway retries with jitter, opens a circuit breaker on a failing provider, falls back to another one, and</text><text x="90" y="815" font-size="18.5" fill="#1E293B">limits each tenant so one noisy customer cannot use everyone&#x27;s capacity.</text><circle cx="71" cy="841" r="3.6" fill="#94A3B8"/><text x="90" y="851" font-size="18.5" fill="#1E293B">Prove it: reliability is written as three SLOs in one file. Alerts are generated from it, and a chaos runner breaks a demo</text><text x="90" y="877" font-size="18.5" fill="#1E293B">service and checks what happened.</text><circle cx="71" cy="903" r="3.6" fill="#94A3B8"/><text x="90" y="913" font-size="18.5" fill="#1E293B">Recover: drpilot opens an incident, runs the matching playbook and writes a postmortem draft. It leaves the root cause</text><text x="90" y="939" font-size="18.5" fill="#1E293B">as a TODO for a human instead of guessing. The 05 outage test is a single local run with mock providers.</text><rect x="40" y="987" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1003" font-size="15.5" fill="#334155">Question</text><rect x="159.53125" y="987" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="187.53125" y="1003" font-size="15.5" fill="#334155">Stay up</text><rect x="268.828125" y="987" width="20" height="20" rx="6" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2"/><text x="296.828125" y="1003" font-size="15.5" fill="#334155">Prove it</text><rect x="377.953125" y="987" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="405.953125" y="1003" font-size="15.5" fill="#334155">Recover</text><rect x="491.859375" y="987" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="519.859375" y="1003" font-size="15.5" fill="#334155">Measured</text><text x="40" y="1037" font-size="14" fill="#94A3B8">Source: projects/05, 07 and 08</text></svg>
