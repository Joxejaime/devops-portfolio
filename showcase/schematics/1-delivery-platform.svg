<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1303" viewBox="0 0 1200 1303" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">From a commit to an on-call page</title><desc id="d">From a commit to an on-call page. One service, release-tracker, followed through four stages. Projects 01 to 04. Ship: every change is linted, tested, scanned and built into a container image. The build fails on any fixable high or critical vulnerability, and an image that passes is signed. Run: Terraform builds the AWS network and containers. Deploy: Argo CD watches Git, so a cluster changes only through a reviewed pull request, and production waits for a human. Observe: alerts fire on how fast the error budget is burning, and every page links to a runbook. Terraform from Run is applied and running on AWS in Juega App. The Kubernetes stage is demonstrated with manifests and policy tests, not a live cluster.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1301" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="309" height="30" rx="15" fill="#E6F0FF" stroke="#2563EB" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#0B2A5B">CATEGORY 1 · DELIVERY PLATFORM</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">From a commit to an on-call page</text><text x="40" y="151" font-size="21" fill="#475569">One service, release-tracker, followed through four stages. Projects 01 to 04.</text><g transform="translate(0,191.0)"><path d="M600.0,64.0 L600.0,88.0 Q600.0,100.0 588.0,100.0 L192.0,100.0 Q180.0,100.0 180.0,112.0 L180.0,136.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M290.0,231.0 L350.0,231.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M570.0,231.0 L630.0,231.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M850.0,231.0 L910.0,231.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M180.0,326.0 L180.0,398.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M460.0,335.5 L460.0,424.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M740.0,346.0 L740.0,411.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M1020.0,335.5 L1020.0,411.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="70.0" y="0.0" width="1060.0" height="64.0" rx="32.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(86.0,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="120.0" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">A commit to release-tracker</text><rect x="70.0" y="136.0" width="220.0" height="190.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(86.0,150.0) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="120.0" y="172.0" font-size="21" font-weight="700" fill="#0B2A5B">Ship (01)</text><text x="86.0" y="200.0" font-size="16.5" fill="#334155">lint, 15 unit tests,</text><text x="86.0" y="221.0" font-size="16.5" fill="#334155">Dockerfile lint, secret</text><text x="86.0" y="242.0" font-size="16.5" fill="#334155">scan, image build and</text><text x="86.0" y="263.0" font-size="16.5" fill="#334155">smoke test, Trivy gate,</text><text x="86.0" y="284.0" font-size="16.5" fill="#334155">SBOM, cosign signature</text><text x="86.0" y="305.0" font-size="16.5" fill="#334155">on the digest</text><circle cx="72.0" cy="138.0" r="15" fill="#2563EB" stroke="#fff" stroke-width="3"/><text x="72.0" y="144.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><rect x="350.0" y="126.5" width="220.0" height="209.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(366.0,140.5) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="400.0" y="162.5" font-size="21" font-weight="700" fill="#431407">Run (02)</text><text x="366.0" y="190.5" font-size="16.5" fill="#334155">Terraform: multi-AZ</text><text x="366.0" y="211.5" font-size="16.5" fill="#334155">VPC and ECS Fargate</text><text x="366.0" y="232.5" font-size="16.5" fill="#334155">behind an ALB, dev and</text><text x="366.0" y="253.5" font-size="16.5" fill="#334155">prod, remote state,</text><text x="366.0" y="274.5" font-size="16.5" fill="#334155">OIDC deploy role, plan</text><text x="366.0" y="295.5" font-size="16.5" fill="#334155">on pull request, apply</text><text x="366.0" y="316.5" font-size="16.5" fill="#334155">behind approval</text><circle cx="352.0" cy="128.5" r="15" fill="#EA580C" stroke="#fff" stroke-width="3"/><text x="352.0" y="134.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><rect x="630.0" y="116.0" width="220.0" height="230.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(646.0,130.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="680.0" y="152.0" font-size="21" font-weight="700" fill="#053F3A">Deploy (03)</text><text x="646.0" y="180.0" font-size="16.5" fill="#334155">Kustomize overlays,</text><text x="646.0" y="201.0" font-size="16.5" fill="#334155">Argo CD auto-syncs</text><text x="646.0" y="222.0" font-size="16.5" fill="#334155">dev and waits for a</text><text x="646.0" y="243.0" font-size="16.5" fill="#334155">human on prod,</text><text x="646.0" y="264.0" font-size="16.5" fill="#334155">restricted pods,</text><text x="646.0" y="285.0" font-size="16.5" fill="#334155">default-deny network,</text><text x="646.0" y="306.0" font-size="16.5" fill="#334155">policy checker with</text><text x="646.0" y="327.0" font-size="16.5" fill="#334155">tests</text><circle cx="632.0" cy="118.0" r="15" fill="#0D9488" stroke="#fff" stroke-width="3"/><text x="632.0" y="124.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><rect x="910.0" y="126.5" width="220.0" height="209.0" rx="14" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2.2"/><g transform="translate(926.0,140.5) scale(1.083)" fill="none" stroke="#7C3AED" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></g><text x="960.0" y="162.5" font-size="21" font-weight="700" fill="#2E1065">Observe (04)</text><text x="926.0" y="190.5" font-size="16.5" fill="#334155">burn-rate alerts at</text><text x="926.0" y="211.5" font-size="16.5" fill="#334155">14.4x, 6x, 3x and 1x</text><text x="926.0" y="232.5" font-size="16.5" fill="#334155">from one SLO file,</text><text x="926.0" y="253.5" font-size="16.5" fill="#334155">Alertmanager routing,</text><text x="926.0" y="274.5" font-size="16.5" fill="#334155">dashboards as code,</text><text x="926.0" y="295.5" font-size="16.5" fill="#334155">runbook link on every</text><text x="926.0" y="316.5" font-size="16.5" fill="#334155">page</text><circle cx="912.0" cy="128.5" r="15" fill="#7C3AED" stroke="#fff" stroke-width="3"/><text x="912.0" y="134.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><rect x="70.0" y="398.0" width="220.0" height="134.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(86.0,412.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="120.0" y="434.0" font-size="21" font-weight="700" fill="#06361A">A signed</text><text x="120.0" y="460.0" font-size="21" font-weight="700" fill="#06361A">image that</text><text x="120.0" y="486.0" font-size="21" font-weight="700" fill="#06361A">passed the</text><text x="120.0" y="512.0" font-size="21" font-weight="700" fill="#06361A">gate</text><rect x="350.0" y="424.0" width="220.0" height="82.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(366.0,438.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="400.0" y="460.0" font-size="21" font-weight="700" fill="#06361A">Cloud with no</text><text x="400.0" y="486.0" font-size="21" font-weight="700" fill="#06361A">stored keys</text><rect x="630.0" y="411.0" width="220.0" height="108.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(646.0,425.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="680.0" y="447.0" font-size="21" font-weight="700" fill="#06361A">Changes only</text><text x="680.0" y="473.0" font-size="21" font-weight="700" fill="#06361A">by reviewed</text><text x="680.0" y="499.0" font-size="21" font-weight="700" fill="#06361A">pull request</text><rect x="910.0" y="411.0" width="220.0" height="108.0" rx="14" fill="#E2F8E8" stroke="#16A34A" stroke-width="2.2"/><g transform="translate(926.0,425.0) scale(1.083)" fill="none" stroke="#16A34A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></g><text x="960.0" y="447.0" font-size="21" font-weight="700" fill="#06361A">A page with a</text><text x="960.0" y="473.0" font-size="21" font-weight="700" fill="#06361A">runbook</text><text x="960.0" y="499.0" font-size="21" font-weight="700" fill="#06361A">attached</text><rect x="70.0" y="584.0" width="1060.0" height="104.0" rx="14" fill="#FFE8EC" stroke="#E11D48" stroke-width="2.2"/><g transform="translate(86.0,598.0) scale(1.083)" fill="none" stroke="#E11D48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text x="120.0" y="620.0" font-size="21" font-weight="700" fill="#6B0A20">The gate caught a real problem</text><text x="86.0" y="648.0" font-size="16.5" fill="#334155">Trivy failed its first real run on four fixable HIGH CVEs inside pip. The final image is now built FROM scratch, so the scanned image</text><text x="86.0" y="669.0" font-size="16.5" fill="#334155">is exactly the image that runs.</text></g><rect x="40" y="919" width="1120" height="276" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="955" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="983" r="3.6" fill="#94A3B8"/><text x="90" y="993" font-size="18.5" fill="#1E293B">Ship: every change is linted, tested, scanned and built into a container image. The build fails on any fixable high or</text><text x="90" y="1019" font-size="18.5" fill="#1E293B">critical vulnerability, and an image that passes is signed.</text><circle cx="71" cy="1045" r="3.6" fill="#94A3B8"/><text x="90" y="1055" font-size="18.5" fill="#1E293B">Run: Terraform builds the AWS network and containers. Deploy: Argo CD watches Git, so a cluster changes only</text><text x="90" y="1081" font-size="18.5" fill="#1E293B">through a reviewed pull request, and production waits for a human. Observe: alerts fire on how fast the error budget is</text><text x="90" y="1107" font-size="18.5" fill="#1E293B">burning, and every page links to a runbook.</text><circle cx="71" cy="1133" r="3.6" fill="#94A3B8"/><text x="90" y="1143" font-size="18.5" fill="#1E293B">Terraform from Run is applied and running on AWS in Juega App. The Kubernetes stage is demonstrated with manifests</text><text x="90" y="1169" font-size="18.5" fill="#1E293B">and policy tests, not a live cluster.</text><rect x="40" y="1217" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1233" font-size="15.5" fill="#334155">Start</text><rect x="128.953125" y="1217" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="156.953125" y="1233" font-size="15.5" fill="#334155">Ship</text><rect x="215.296875" y="1217" width="20" height="20" rx="6" fill="#FFEEDC" stroke="#EA580C" stroke-width="2"/><text x="243.296875" y="1233" font-size="15.5" fill="#334155">Run</text><rect x="297.59375" y="1217" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="325.59375" y="1233" font-size="15.5" fill="#334155">Deploy</text><rect x="402.765625" y="1217" width="20" height="20" rx="6" fill="#F0EAFF" stroke="#7C3AED" stroke-width="2"/><text x="430.765625" y="1233" font-size="15.5" fill="#334155">Observe</text><rect x="518.859375" y="1217" width="20" height="20" rx="6" fill="#E2F8E8" stroke="#16A34A" stroke-width="2"/><text x="546.859375" y="1233" font-size="15.5" fill="#334155">Result</text><rect x="618.046875" y="1217" width="20" height="20" rx="6" fill="#FFE8EC" stroke="#E11D48" stroke-width="2"/><text x="646.046875" y="1233" font-size="15.5" fill="#334155">Evidence</text><text x="40" y="1267" font-size="14" fill="#94A3B8">Source: projects/01 to 04</text></svg>
