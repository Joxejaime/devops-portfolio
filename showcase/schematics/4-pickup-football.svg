<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">One server, no open SSH port, no stored cloud keys</title><desc id="d">One server, no open SSH port, no stored cloud keys. A real product, live in a closed test: players use the app, GitHub deploys it, and S3 holds the nightly backups. Players open the iOS, Android or web app. All traffic reaches Caddy, which handles HTTPS automatically, then the API, then PostgreSQL. The API talks to the database over TLS only, and everything runs on one EC2 host with port 22 closed. Every push to the dev branch is deployed by GitHub Actions. It proves who it is to AWS with a short-lived OIDC identity, so no access keys are stored anywhere. It pushes the image to ECR and tells the server to update through SSM Run Command, so nobody needs SSH. A nightly pg_dump goes to S3.</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5,1.5 L10.5,6 L1.5,10.5 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="1198" height="1118" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="40" y="34" width="202" height="30" rx="15" fill="#E2F8E8" stroke="#16A34A" stroke-width="1.5"/><text x="54" y="54" font-size="14" font-weight="700" letter-spacing="1" fill="#06361A">APPLIED · JUEGA APP</text><text x="40" y="114" font-size="38" font-weight="700" fill="#0F172A">One server, no open SSH port, no stored cloud keys</text><text x="40" y="151" font-size="21" fill="#475569">A real product, live in a closed test: players use the app, GitHub deploys it, and S3 holds the nightly backups.</text><g transform="translate(0,231.0)"><rect x="346.0" y="-48.0" width="788.0" height="201.0" rx="20" fill="#F2FCFA" stroke="#0D9488" stroke-width="1.6"/><rect x="66.0" y="-54.0" width="228.0" height="383.0" rx="20" fill="#F5F7FF" stroke="#6366F1" stroke-width="1.6"/><path d="M270.0,67.5 L370.0,67.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M270.0,253.0 L394.0,253.0 Q406.0,253.0 406.0,241.0 L406.0,109.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M550.0,67.5 L650.0,67.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M830.0,67.5 L930.0,67.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M460.0,371.0 L460.0,252.0 Q460.0,240.0 472.0,240.0 L484.0,240.0 Q496.0,240.0 496.0,228.0 L496.0,109.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="378.0" y="290.5" width="164.0" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="460.0" y="309.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">SSM Run Command</text><path d="M550.0,436.0 L650.0,436.0" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="571.7" y="421.0" width="56.5" height="30" rx="9" fill="#fff" stroke="#E2E8F0" stroke-width="1.2"/><text x="600.0" y="440.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#334155">OIDC</text><path d="M740.0,381.5 L740.0,119.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><path d="M1020.0,129.0 L1020.0,374.5" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arr)"/><rect x="354.0" y="-40.0" width="341.5" height="26" rx="13" fill="#F2FCFA"/><text x="365.0" y="-21.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#0D9488">ONE EC2 HOST, SSH PORT 22 CLOSED</text><rect x="74.0" y="-46.0" width="97.6" height="26" rx="13" fill="#F5F7FF"/><text x="85.0" y="-27.0" font-size="15" font-weight="700" letter-spacing="1.2" fill="#6366F1">PLAYERS</text><rect x="90.0" y="0.0" width="180.0" height="135.0" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(106.0,14.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="140.0" y="36.0" font-size="21" font-weight="700" fill="#1E1B4B">iOS and</text><text x="140.0" y="62.0" font-size="21" font-weight="700" fill="#1E1B4B">Android</text><text x="140.0" y="88.0" font-size="21" font-weight="700" fill="#1E1B4B">app</text><text x="106.0" y="116.0" font-size="16.5" fill="#334155">Expo</text><rect x="90.0" y="201.0" width="180.0" height="104.0" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/><g transform="translate(106.0,215.0) scale(1.083)" fill="none" stroke="#6366F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="140.0" y="237.0" font-size="21" font-weight="700" fill="#1E1B4B">Web app</text><text x="106.0" y="265.0" font-size="16.5" fill="#334155">same code as the</text><text x="106.0" y="286.0" font-size="16.5" fill="#334155">app</text><rect x="370.0" y="26.0" width="180.0" height="83.0" rx="14" fill="#E3F8F3" stroke="#0D9488" stroke-width="2.2"/><g transform="translate(386.0,40.0) scale(1.083)" fill="none" stroke="#0D9488" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="420.0" y="62.0" font-size="21" font-weight="700" fill="#053F3A">Caddy</text><text x="386.0" y="90.0" font-size="16.5" fill="#334155">automatic HTTPS</text><rect x="650.0" y="15.5" width="180.0" height="104.0" rx="14" fill="#E6F0FF" stroke="#2563EB" stroke-width="2.2"/><g transform="translate(666.0,29.5) scale(1.083)" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g><text x="700.0" y="51.5" font-size="21" font-weight="700" fill="#0B2A5B">API</text><text x="666.0" y="79.5" font-size="16.5" fill="#334155">Fastify and</text><text x="666.0" y="100.5" font-size="16.5" fill="#334155">TypeScript</text><path d="M930.0,17.0 v101.0 a90.0,11 0 0 0 180.0,0 v-101.0 a90.0,11 0 0 0 -180.0,0 z" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><path d="M930.0,17.0 a90.0,11 0 0 0 180.0,0" fill="none" stroke="#D97706" stroke-width="2.2"/><g transform="translate(946.0,30.0) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="980.0" y="52.0" font-size="21" font-weight="700" fill="#4D2B00">PostgreSQL</text><text x="980.0" y="78.0" font-size="21" font-weight="700" fill="#4D2B00">16</text><text x="946.0" y="106.0" font-size="16.5" fill="#334155">TLS only</text><rect x="370.0" y="371.0" width="180.0" height="130.0" rx="14" fill="#FFEEDC" stroke="#EA580C" stroke-width="2.2"/><g transform="translate(386.0,385.0) scale(1.083)" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/></g><text x="420.0" y="407.0" font-size="21" font-weight="700" fill="#431407">GitHub</text><text x="420.0" y="433.0" font-size="21" font-weight="700" fill="#431407">Actions</text><text x="386.0" y="461.0" font-size="16.5" fill="#334155">runs on every</text><text x="386.0" y="482.0" font-size="16.5" fill="#334155">push to dev</text><rect x="650.0" y="381.5" width="180.0" height="109.0" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/><g transform="translate(666.0,395.5) scale(1.083)" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="700.0" y="417.5" font-size="21" font-weight="700" fill="#0F172A">Amazon</text><text x="700.0" y="443.5" font-size="21" font-weight="700" fill="#0F172A">ECR</text><text x="666.0" y="471.5" font-size="16.5" fill="#334155">image registry</text><path d="M930.0,385.5 v101.0 a90.0,11 0 0 0 180.0,0 v-101.0 a90.0,11 0 0 0 -180.0,0 z" fill="#FFF4D6" stroke="#D97706" stroke-width="2.2"/><path d="M930.0,385.5 a90.0,11 0 0 0 180.0,0" fill="none" stroke="#D97706" stroke-width="2.2"/><g transform="translate(946.0,398.5) scale(1.083)" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="980.0" y="420.5" font-size="21" font-weight="700" fill="#4D2B00">S3</text><text x="980.0" y="446.5" font-size="21" font-weight="700" fill="#4D2B00">backups</text><text x="946.0" y="474.5" font-size="16.5" fill="#334155">nightly pg_dump</text></g><rect x="40" y="772" width="1120" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="66" y="808" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748B">IN PLAIN WORDS</text><circle cx="71" cy="836" r="3.6" fill="#94A3B8"/><text x="90" y="846" font-size="18.5" fill="#1E293B">Players open the iOS, Android or web app. All traffic reaches Caddy, which handles HTTPS automatically, then the API,</text><text x="90" y="872" font-size="18.5" fill="#1E293B">then PostgreSQL. The API talks to the database over TLS only, and everything runs on one EC2 host with port 22</text><text x="90" y="898" font-size="18.5" fill="#1E293B">closed.</text><circle cx="71" cy="924" r="3.6" fill="#94A3B8"/><text x="90" y="934" font-size="18.5" fill="#1E293B">Every push to the dev branch is deployed by GitHub Actions. It proves who it is to AWS with a short-lived OIDC identity,</text><text x="90" y="960" font-size="18.5" fill="#1E293B">so no access keys are stored anywhere. It pushes the image to ECR and tells the server to update through SSM Run</text><text x="90" y="986" font-size="18.5" fill="#1E293B">Command, so nobody needs SSH. A nightly pg_dump goes to S3.</text><rect x="40" y="1034" width="20" height="20" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="68" y="1050" font-size="15.5" fill="#334155">Players</text><rect x="147.59375" y="1034" width="20" height="20" rx="6" fill="#E3F8F3" stroke="#0D9488" stroke-width="2"/><text x="175.59375" y="1050" font-size="15.5" fill="#334155">Web server</text><rect x="285.53125" y="1034" width="20" height="20" rx="6" fill="#E6F0FF" stroke="#2563EB" stroke-width="2"/><text x="313.53125" y="1050" font-size="15.5" fill="#334155">API</text><rect x="364.28125" y="1034" width="20" height="20" rx="6" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text x="392.28125" y="1050" font-size="15.5" fill="#334155">Database and backups</text><rect x="586.203125" y="1034" width="20" height="20" rx="6" fill="#FFEEDC" stroke="#EA580C" stroke-width="2"/><text x="614.203125" y="1050" font-size="15.5" fill="#334155">Delivery</text><rect x="700.171875" y="1034" width="20" height="20" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="728.171875" y="1050" font-size="15.5" fill="#334155">AWS container registry</text><text x="40" y="1084" font-size="14" fill="#94A3B8">Source: Private repository; the architecture is public in showcase/</text></svg>
