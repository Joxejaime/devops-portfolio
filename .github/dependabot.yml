version: 2
# Updates go to main as pull requests; CI on the pull request is the gate. Major versions are planned
# upgrades, not bot pull requests, so few update branches exist at once.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates travel together; a major update gets its own pull request,
      # so one breaking action cannot hold back the rest.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /projects/01-secure-cicd-pipeline
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /projects/02-aws-terraform-platform/envs/dev
    schedule:
      interval: weekly
    ignore:
      # The v6 bump failed this project's CI checks. Move to 6.x as a deliberate migration, not a bot PR.
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: /projects/02-aws-terraform-platform/envs/prod
    schedule:
      interval: weekly
    ignore:
      # The v6 bump failed this project's CI checks. Move to 6.x as a deliberate migration, not a bot PR.
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
